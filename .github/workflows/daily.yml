name: daily rebuild

# Rebuilds the heavy data once a day after the close: the universe, 2 years of
# price history, the indicator values and the per-symbol chart files.
#
# This one DOES need the database, and a runner has none (db/stock.db is
# gitignored, ~148k rows). So it rebuilds from scratch via `main.py setup`,
# which pulls 2 years for the whole universe from yfinance. That is slow and
# depends on an unofficial source, so the job is allowed to fail without
# taking the site down: the intraday workflow keeps serving prices from the
# last good index.json, and the page displays the data timestamp so staleness
# is visible rather than silent.

on:
  schedule:
    # 07:37 UTC = 15:37 Taipei, Mon-Fri — after the 13:30 close and after
    # TWSE has published the day's figures. Off-minute on purpose.
    - cron: "37 7 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Keeping the DB between runs turns the 2-year backfill into an
      # incremental update. A cache miss just means a slower cold rebuild.
      - name: Restore database cache
        uses: actions/cache@v4
        with:
          path: db/stock.db
          key: stockdb-${{ github.run_id }}
          restore-keys: stockdb-

      - name: Build or update the database
        run: |
          if [ -f db/stock.db ]; then
            echo "cache hit -> incremental update"
            python main.py update
          else
            echo "cache miss -> full setup (2y backfill)"
            python main.py setup
          fi

      - name: Rebuild web data
        run: python scripts/build_web_data.py full

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data
          if git diff --cached --quiet; then
            echo "no change; nothing to commit"
          else
            git commit -m "data: daily rebuild $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push
          fi
