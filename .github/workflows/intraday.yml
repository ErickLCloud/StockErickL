name: intraday quotes

# Refreshes web/data/quotes.json + market.json during Taiwan market hours.
#
# This job needs NO database: build_web_data.py quotes reads the committed
# web/data/index.json for the universe and fallback closes. That is why it can
# run on a bare runner in seconds.
#
# Honest caveat: GitHub's scheduled runners are best-effort and are commonly
# delayed by 5-15 minutes under load, and can be skipped entirely. Treat the
# page as "near real time", not a ticker. The page shows the timestamp of the
# data it is actually displaying, so a stale run is visible rather than hidden.

on:
  schedule:
    # Every 5 min, 01:00-06:55 UTC = 09:00-14:55 Taipei, Mon-Fri.
    # Taiwan market trades 09:00-13:30 Taipei; the tail catches the close.
    - cron: "*/5 1-6 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: intraday
  cancel-in-progress: false

jobs:
  quotes:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh quotes (no DB required)
        run: python scripts/build_web_data.py quotes

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/quotes.json web/data/market.json
          if git diff --cached --quiet; then
            echo "no change; nothing to commit"
          else
            git commit -m "data: intraday quotes $(date -u +%Y-%m-%dT%H:%MZ)"
            # Another run may have landed first; rebase onto it and retry once.
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push
          fi
