name: site

# Builds the dashboard and deploys it to GitHub Pages directly from this
# workflow. Generated data is NOT committed to main.
#
# Why: the full market is ~2,400 symbols, so quotes.json is ~300 KB and was
# going to be rewritten every 5 minutes (~70 commits a trading day), and each
# commit also triggered a Pages build. Deploying an artifact keeps main clean.
#
# Two kinds of data, two lifetimes:
#   fast  index / quotes / fundamentals / TAIEX  rebuilt on EVERY run (~90 s,
#         standard library only, nothing to pip install)
#   slow  indicators + per-symbol history        rebuilt once a day (~10 min,
#         yfinance) and parked on the orphan `data` branch, force-pushed as a
#         single commit so it never accumulates history. Every other run
#         downloads it from there.
#
# If the daily history build fails (yfinance rate limits are the likely cause
# on a shared runner IP) the run still deploys fresh quotes together with the
# previous history. The page shows the date of the history it has, so a stale
# build is visible rather than silent.
#
# Honest caveat: GitHub's scheduled runs are best-effort. Under load they are
# commonly 5-15 minutes late and are sometimes skipped. This is near real
# time, not a ticker.

on:
  schedule:
    - cron: "*/5 1-6 * * 1-5"   # quotes, 09:00-14:55 Taipei, Mon-Fri
    - cron: "37 7 * * 1-5"      # history rebuild, 15:37 Taipei (after the close)
    - cron: "0 0 * * 1-5"       # 盤前解讀 (AI), 08:00 Taipei
  workflow_dispatch:
    inputs:
      mode:
        description: "quotes = prices only (fast); full = also rebuild history (~10 min); interpret = also write the AI pre-market note"
        type: choice
        options: [quotes, full, interpret]
        default: quotes

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write           # push the `data` branch
      id-token: write           # GitHub OIDC token, exchanged for a short-lived Anthropic token (interpret mode)
    env:
      MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event.schedule == '37 7 * * 1-5' && 'full' || (github.event.schedule == '0 0 * * 1-5' && 'interpret' || 'quotes')) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Copies docs/ minus data/, NOT a hard-coded file list. The list used to
      # name index.html and calc.js only, so analysis.js never shipped and the
      # scan / analysis / backtest tabs were dead on the live site.
      - name: Assemble the site skeleton
        run: python scripts/assemble_site.py _site

      - name: Fetch the last good history from the data branch
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git clone --quiet --depth 1 --branch data --single-branch \
              "https://github.com/${GITHUB_REPOSITORY}.git" _data
            rm -rf _data/.git
            cp -r _data/. _site/data/
            rm -rf _site/data/.git     # belt and braces: never deploy git metadata
            echo "restored $(ls _site/data/history 2>/dev/null | wc -l) history files"
          else
            echo "::notice::no data branch yet - run this workflow once with mode=full"
          fi

      - name: Install history dependencies
        if: env.MODE == 'full'
        run: pip install -r requirements.txt

      - name: Rebuild history and indicators (daily)
        id: history
        if: env.MODE == 'full'
        continue-on-error: true
        run: |
          python -u scripts/build_web_data.py history --out _hist
          # Only reached when the build kept >= 90% of the symbols; it exits
          # non-zero otherwise, so a partial build can never replace good data.
          cp -r _hist/. _site/data/

      # Monthly revenue / EPS / gross margin. The endpoints only serve the latest
      # period, so earlier period snapshots are restored from the data branch and
      # merged (late reporters are added). Written into _hist so they ride along
      # with the history push; copied into the site either way.
      - name: Rebuild financials (daily)
        if: env.MODE == 'full'
        continue-on-error: true
        run: |
          mkdir -p _hist/financials
          if [ -d _site/data/financials ]; then cp -rn _site/data/financials/. _hist/financials/; fi
          python -u scripts/build_web_data.py financials --out _hist
          cp _hist/financials.json _site/data/
          mkdir -p _site/data/financials && cp -r _hist/financials/. _site/data/financials/

      - name: Publish the new history to the data branch
        if: env.MODE == 'full' && steps.history.outcome == 'success'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # the AI notes live on the data branch too; carry them into the fresh single commit
          if [ -f _site/data/interpret.json ]; then cp _site/data/interpret.json _hist/; fi
          if [ -d _site/data/interpret ]; then mkdir -p _hist/interpret && cp -r _site/data/interpret/. _hist/interpret/; fi
          cd _hist
          git init -q -b data
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "history data $(date -u +%Y-%m-%d)"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data

      - name: Warn when the daily history failed
        if: env.MODE == 'full' && steps.history.outcome != 'success'
        run: echo "::warning::history rebuild failed; deploying fresh quotes with the PREVIOUS history"

      # The live-quote Edge Function lives in a free Supabase project, which is
      # paused after about a week without database activity. One tiny read a day
      # keeps it up. Never fails the build: the page falls back to the snapshot.
      - name: Keep the Supabase project awake (daily)
        if: env.MODE == 'full'
        continue-on-error: true
        env:
          SB_URL: ${{ secrets.SUPABASE_URL }}
          SB_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$SB_URL" ] || [ -z "$SB_KEY" ]; then echo "::notice::SUPABASE_URL / SUPABASE_KEY not set; skipping"; exit 0; fi
          curl -fsS -m 30 "$SB_URL/rest/v1/keepalive?select=id&limit=1" -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY"

      - name: Refresh prices, index, fundamentals and TAIEX
        run: python scripts/build_web_data.py quotes --out _site/data

      # 盤前解讀 (decisions D10-D15). No API key anywhere: the job's GitHub OIDC token is
      # exchanged for a ~10-minute Anthropic token (Workload Identity Federation; the
      # Console rule only trusts this repo's main branch). The script skips weekends,
      # TWSE holidays and a second run on the same day. Never fails the build: the page
      # keeps showing the previous note, labelled with its date.
      - name: Pre-market AI note (interpret)
        id: interpret
        if: env.MODE == 'interpret'
        continue-on-error: true
        env:
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_IDENTITY_TOKEN_FILE: ${{ runner.temp }}/gha-jwt
        run: |
          curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" | jq -r .value > "$ANTHROPIC_IDENTITY_TOKEN_FILE"
          python -u scripts/interpret.py --out _site/data

      - name: Keep the AI note on the data branch
        if: env.MODE == 'interpret' && steps.interpret.outcome == 'success'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -f _site/data/interpret.json ] || { echo "nothing new"; exit 0; }
          git clone --quiet --depth 1 --branch data --single-branch \
            "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" _push
          mkdir -p _push/interpret
          cp _site/data/interpret.json _push/ && cp -r _site/data/interpret/. _push/interpret/
          cd _push
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -q -m "interpret $(date -u +%Y-%m-%d)"
          git push -q origin data

      # Checks the ASSEMBLED site: every script/stylesheet index.html references
      # must be present, and the market data must be complete. A failure here
      # stops the deploy, so the previous good site stays up.
      - name: Sanity check the assembled site before deploying
        run: python scripts/check_site.py _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
