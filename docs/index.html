<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>台股看板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap">
<style>
  :root{
    --bg:#f5f5ee; --panel:#fff; --line:#e6e6d3; --ink:#002a1d; --muted:#7b8f85;
    --up:#d6453a;        /* 台股慣例：紅漲 */
    --down:#12915f;      /* 綠跌 */
    --flat:#7b8f85; --warn:#a85d10; --warnbg:#fdf0df;
    --accent:#349f87; --accent-ink:#fff; --hover:#eef6f3; --star:#e0a100;
    --mint:#def2ef; --deep:#002a1d; --orange:#efa661; --soft:#f8f8f3;
    --shadow:0 1px 2px rgba(0,42,29,.05),0 6px 18px -10px rgba(0,42,29,.18);
    --font-jp:"Zen Kaku Gothic New","Noto Sans TC","Microsoft JhengHei",system-ui,-apple-system,sans-serif;
    --font-num:"Roboto","Segoe UI","Microsoft JhengHei",system-ui,sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#0d1713; --panel:#13211b; --line:#243a31; --ink:#e7f1ec; --muted:#8aa699;
      --up:#ff7a6e; --down:#4fd6a0; --accent:#4fb89f; --hover:#1a2d25; --soft:#102019;
      --warn:#f1b266; --warnbg:#3a2b12; --mint:#16322b; --deep:#06110d;
      --shadow:0 1px 2px rgba(0,0,0,.4); --star:#f5c542;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0d1713; --panel:#13211b; --line:#243a31; --ink:#e7f1ec; --muted:#8aa699;
    --up:#ff7a6e; --down:#4fd6a0; --accent:#4fb89f; --hover:#1a2d25; --soft:#102019;
    --warn:#f1b266; --warnbg:#3a2b12; --mint:#16322b; --deep:#06110d;
    --shadow:0 1px 2px rgba(0,0,0,.4); --star:#f5c542;
  }
  *{box-sizing:border-box}
  html{background:var(--bg)}
  body{margin:0; color:var(--ink); font:15px/1.65 var(--font-jp); letter-spacing:.02em;
    background:linear-gradient(180deg,var(--bg) 0,var(--bg) 55%,var(--mint) 100%) fixed}
  button{font:inherit; color:inherit}
  .num,.big,.v,td,.px,.pct,.taiex{font-family:var(--font-num)}

  /* ---- shell: a sticky top bar, then full-width content.
   * It used to be a 292px sidebar, which left the wide tables (類股, 選股, 首頁) about 1000px. */
  .shell{max-width:1320px; margin:0 auto; padding:0 18px 40px}
  .side{position:sticky; top:0; z-index:20; display:flex; flex-wrap:wrap; align-items:center; gap:6px 18px;
    margin:0 -18px 16px; padding:8px 18px 6px; background:var(--panel); box-shadow:var(--shadow)}
  .wrap{min-width:0}

  .brand{display:flex; align-items:center; gap:8px; white-space:nowrap}
  .brand svg{width:30px; height:30px; flex:none}
  .brand h1{margin:0; font-size:18px; font-weight:700; color:var(--accent); letter-spacing:.12em}
  .brand .en,.brand p{display:none}

  /* tabs: small icon + text, one row; scrolls sideways on a phone */
  .tabs{display:flex; gap:4px; flex:1 1 auto; min-width:0; overflow-x:auto; scrollbar-width:thin}
  .tab{display:flex; flex-direction:row; align-items:center; gap:6px; padding:7px 12px; cursor:pointer; white-space:nowrap;
    background:transparent; border:1px solid transparent; border-radius:999px; color:var(--ink);
    font-size:14px; font-weight:500; letter-spacing:.06em; transition:background .15s}
  .tab svg{width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex:none}
  .tab:hover{background:var(--hover)}
  .tab[aria-pressed="true"]{background:var(--accent); color:#fff}

  .mkt{background:var(--deep); color:#e7f1ec; border-radius:999px; padding:4px 14px; white-space:nowrap}
  .taiex{display:flex; gap:2px 8px; align-items:baseline; font-variant-numeric:tabular-nums}
  .taiex .v{font-size:17px; font-weight:700; letter-spacing:.01em}
  .mkt .taiex span[style]{color:#9fc4b6 !important}
  .mkt .up{color:#ff8f84} .mkt .down{color:#62e0a8} .mkt .flat{color:#9fc4b6}
  .stamp{flex-basis:100%; display:flex; flex-wrap:wrap; gap:0 12px; font-size:11.5px; color:var(--muted); line-height:1.5}
  .stamp.old{color:var(--warn)}
  .dot{display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--accent)}
  .dot.stale{background:var(--orange)}
  @media (max-width:760px){
    .side{gap:6px 10px; position:static}           /* on a phone a sticky bar would eat a fifth of the screen */
    #sub{display:none}
    .mkt{padding:3px 12px} .taiex .v{font-size:15px}
    .tabs{order:3; flex-basis:100%}
    .tab{padding:6px 10px; font-size:13px}
    .brand h1{font-size:16px}
  }
  #chartdock{scroll-margin-top:90px}                 /* the "↓ K 線圖" link must not land under the sticky bar */

  /* ---- content */
  .cols{display:grid; grid-template-columns:330px 1fr; gap:16px; align-items:start}
  @media (max-width:1180px){ .cols{grid-template-columns:1fr} }
  /* wide views (scan, sectors) are tables: the symbol list beside them would only squeeze the columns */
  .cols.wide{grid-template-columns:1fr}
  .cols.wide > .panel:first-child{display:none}
  .panel{background:var(--panel); border-radius:10px; box-shadow:var(--shadow); overflow:hidden; position:relative}
  .pad{padding:16px 18px; position:relative; z-index:1}
  /* the slanted colour band from the reference hero, drawn in CSS */
  #detail::before{content:""; position:absolute; left:0; right:0; top:0; height:104px; z-index:0;
    background:linear-gradient(100deg,var(--mint) 0,rgba(222,242,239,0) 78%); clip-path:polygon(0 0,100% 0,100% 28%,0 100%); opacity:.9}

  #q{width:100%; padding:11px 14px; font:inherit; font-size:14.5px; color:var(--ink);
    background:var(--soft); border:1px solid var(--line); border-radius:999px}
  #q:focus,input:focus,select:focus{outline:2px solid var(--accent); outline-offset:1px}
  .filters{display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; align-items:center}
  .chip{font-size:12.5px; padding:4px 12px; border-radius:999px; cursor:pointer;
    background:var(--soft); border:1px solid var(--line); color:var(--muted); letter-spacing:.06em}
  .chip[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:#fff}
  .sep{width:1px; height:18px; background:var(--line); margin:0 2px}
  select{font:inherit; font-size:12.5px; padding:4px 8px; color:var(--ink);
    background:var(--soft); border:1px solid var(--line); border-radius:8px; margin-left:auto}
  .count{color:var(--muted); font-size:12px; margin-top:8px}

  .list{max-height:68vh; overflow:auto; border-top:1px solid var(--line)}
  .row{display:grid; grid-template-columns:1fr auto; gap:1px 10px; padding:9px 18px;
    cursor:pointer; border-bottom:1px solid var(--line)}
  .row:hover{background:var(--hover)}
  .row[aria-selected="true"]{background:var(--hover); box-shadow:inset 4px 0 0 var(--accent)}
  .row .code{font-weight:700; font-variant-numeric:tabular-nums; font-family:var(--font-num)}
  .row .name{color:var(--muted); font-size:12px}
  .row .px{font-variant-numeric:tabular-nums; font-weight:700; text-align:right}
  .row .pct{font-variant-numeric:tabular-nums; font-size:12.5px; text-align:right}
  .kind{font-size:10px; color:var(--accent); border:1px solid var(--accent); border-radius:4px;
    padding:0 4px; margin-left:4px; font-weight:500; letter-spacing:.06em}
  .star{cursor:pointer; color:var(--muted); user-select:none; padding-right:2px}
  .star.on{color:var(--star)}
  .more{padding:10px 16px; color:var(--muted); font-size:12.5px; text-align:center}

  .up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--flat)}

  .head{display:flex; flex-wrap:wrap; gap:4px 12px; align-items:baseline}
  .head .big{font-size:34px; font-weight:700; font-variant-numeric:tabular-nums; line-height:1.2}
  .head .sym{font-size:19px; font-weight:700; letter-spacing:.06em}
  .tag{font-size:11.5px; padding:2px 10px; border-radius:999px; background:var(--soft);
    border:1px solid var(--line); color:var(--muted); letter-spacing:.06em}
  .starbtn{font-size:20px; background:none; border:none; cursor:pointer; color:var(--muted); padding:0 4px}
  .starbtn.on{color:var(--star)}
  .act{font-size:12.5px; padding:3px 12px; border-radius:999px; cursor:pointer;
    background:var(--panel); border:1px solid var(--accent); color:var(--accent); letter-spacing:.06em}
  .act:hover{background:var(--accent); color:#fff}
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(128px,1fr)); gap:10px; margin-top:14px}
  .cell{background:var(--soft); border:1px solid var(--line); border-radius:10px; padding:8px 12px}
  .cell .k{font-size:11.5px; color:var(--muted); letter-spacing:.06em}
  .cell .v{font-size:16px; font-weight:700; font-variant-numeric:tabular-nums; margin-top:1px}
  .sub{margin:18px 0 -4px; font-size:13px; color:var(--accent); font-weight:700; letter-spacing:.08em;
    display:flex; align-items:center; gap:8px}
  .sub::before{content:""; width:4px; height:14px; border-radius:2px; background:var(--accent); flex:none}
  .alert{margin-top:12px; padding:9px 12px; border-radius:10px; font-size:13px;
    color:var(--warn); background:var(--warnbg); border:1px solid var(--orange)}
  .ranges{display:flex; gap:6px; margin:16px 0 8px}
  svg{display:block; width:100%; height:auto}
  .empty{color:var(--muted); padding:44px 16px; text-align:center}
  .note{color:var(--muted); font-size:12px; margin-top:12px; line-height:1.8}
  kbd{font:inherit; font-size:11.5px; padding:1px 5px; border:1px solid var(--line);
    border-bottom-width:2px; border-radius:4px; background:var(--soft)}

  /* holdings */
  form.add{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; align-items:end; margin-top:14px}
  form.add label{font-size:12px; color:var(--muted); display:block}
  form.add input{width:100%; padding:8px 10px; font:inherit; color:var(--ink);
    background:var(--soft); border:1px solid var(--line); border-radius:8px}
  .btn{padding:8px 18px; border-radius:999px; cursor:pointer; background:var(--accent);
    border:1px solid var(--accent); color:#fff; font-weight:500; letter-spacing:.1em}
  .btn:hover{filter:brightness(.95)}
  .btn.ghost{background:var(--panel); color:var(--ink); border-color:var(--line)}
  .hint{margin-top:8px; font-size:12.5px; color:var(--muted); min-height:1.2em}
  .hint .act{margin-left:4px}
  .msg{margin-top:4px; font-size:13px; min-height:1.2em}
  .msg.err{color:var(--up)}
  .scroll{overflow-x:auto; margin-top:14px}
  #scantable th,#scantable td{padding:7px 8px; white-space:nowrap}
  #scantable th:nth-child(3),#scantable td:nth-child(3),#scantable th:nth-child(4),#scantable td:nth-child(4){text-align:left}
  #scantable .act{padding:1px 8px; font-size:12px}
  table{border-collapse:collapse; width:100%; font-variant-numeric:tabular-nums; font-size:13.5px}
  th,td{padding:8px 10px; text-align:right; border-bottom:1px solid var(--line); white-space:nowrap}
  th:first-child,td:first-child{text-align:left}
  th{font-size:11.5px; color:var(--muted); font-weight:500; letter-spacing:.08em; background:var(--soft)}
  tfoot td{font-weight:700; border-top:2px solid var(--line)}
  .del{background:none; border:none; cursor:pointer; color:var(--muted); font-size:16px}
  .tools{display:flex; gap:8px; flex-wrap:wrap; margin-top:14px}

  /* scan / analysis / backtest */
  .bar{display:flex; flex-wrap:wrap; gap:8px; align-items:end; margin-top:12px}
  .bar label{font-size:12px; color:var(--muted); display:block}
  .bar input,.bar select{padding:7px 10px; font:inherit; font-size:14px; margin:0; color:var(--ink);
    background:var(--soft); border:1px solid var(--line); border-radius:8px}
  .bar input[type=number]{width:84px}
  .card{border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-top:12px; background:var(--panel);
    box-shadow:var(--shadow); border-left:4px solid var(--accent)}
  .card .cell{background:var(--soft)}
  .card ul,.reasons{margin:8px 0 0; padding-left:18px; font-size:13px; line-height:1.75}
  details.adv{margin-top:12px; border:1px solid var(--line); border-radius:10px; padding:8px 12px; background:var(--bg)}
  details.adv summary{cursor:pointer; font-size:13px; color:var(--muted)}
  details.adv .bar{margin-top:10px}
  .vbox{margin-top:10px; padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:var(--bg); font-size:13.5px; line-height:1.7}
  .vbox[data-tone="better"]{border-color:var(--down)} .vbox[data-tone="worse"]{border-color:var(--up)}
  .vbox[data-tone="none"],.vbox[data-tone="same"]{border-color:var(--warn)}
  ul.why{margin:10px 0 0; padding-left:18px; font-size:13.5px; line-height:1.9}
  ul.why li{margin:4px 0}
  .verdict{display:inline-block; font-weight:700; padding:3px 18px; border-radius:999px; color:#fff; font-size:16px; letter-spacing:.2em}
  .verdict.buy{background:#d6453a} .verdict.sell{background:#12915f} .verdict.hold{background:#7b8f85}
  [hidden]{display:none !important}
  #evtable td,#evtable th{padding:7px 8px} #evtable .tag{white-space:nowrap}
  .seccards{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:12px}
  @media (max-width:640px){ .seccards{grid-template-columns:1fr} }
  .seccard{background:var(--soft); border-radius:10px; padding:10px 14px}
  .secline{display:flex; justify-content:space-between; padding:2px 0; font-size:13.5px}
  #sectable td.selcol{font-weight:700}
  #sectable th,#sectable td{padding:7px 8px; white-space:nowrap}
  #sectable td.l{text-align:left}
  .secmem>td{padding:0 0 8px 18px; background:var(--soft)}
  #chartdock{margin-top:18px}
  .chbar{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:10px}
  .chhint{font-size:12px}
  #ch-info{display:flex; flex-wrap:wrap; gap:4px 16px; margin-top:12px; padding:9px 12px; border-radius:10px; background:var(--soft); font-size:13px; min-height:40px}
  #ch-info .ic i{font-style:normal; color:var(--muted); font-size:11.5px; margin-right:5px}
  #ch-info .ic b{font-family:var(--font-num); font-variant-numeric:tabular-nums}
  #ch-wrap{margin-top:10px; touch-action:pan-y; cursor:crosshair; user-select:none; outline-offset:2px}
  #ch-wrap svg{display:block; max-width:100%}
  .legend{display:flex; flex-wrap:wrap; gap:4px 14px; font-size:12px; color:var(--muted); margin:4px 0 2px}
  .legend i{display:inline-block; width:14px; height:3px; vertical-align:middle; margin-right:4px; border-radius:2px}
  .sc{font-weight:700} .sc.p{color:var(--up)} .sc.n{color:var(--down)}
  .home-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:14px; margin-top:12px}
  .home-box{background:var(--soft); border-radius:12px; padding:12px 14px; min-width:0}
  .home-box h3{margin:0 0 8px; font-size:15px; display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:8px}
  .home-box h3 > span{display:flex; gap:6px}
  .home-box .chip,.head .chip{white-space:nowrap}
  .idxcards{display:flex; flex-wrap:wrap; gap:10px; margin-top:10px}
  .idxcard{background:var(--soft); border-radius:12px; padding:10px 16px; min-width:150px; text-align:center}
  .idxcard .v{font-size:22px; font-weight:700; display:block}
  .idxcard .spark{display:block; margin:4px auto 0}
  .newslist{margin:0; padding-left:18px; columns:2 420px; column-gap:28px; font-size:13.5px; line-height:1.6}
  .newslist li{break-inside:avoid; margin:0 0 6px}
  .newslist a{color:var(--ink); text-decoration:none} .newslist a:hover{color:var(--accent); text-decoration:underline}
  .hbar{display:grid; grid-template-columns:84px 1fr 60px 64px; gap:8px; align-items:center; font-size:13px; margin:5px 0}
  .hbar .rs{text-align:right; font-family:var(--font-num)}
  .hbar i{display:block; height:14px; border-radius:2px}
  .hbar i.up{background:var(--up)} .hbar i.down{background:var(--down)}
  .dist{display:flex; align-items:flex-end; gap:6px; height:150px; margin-top:6px}
  .dist > div{flex:1; text-align:center; font-size:11.5px; display:flex; flex-direction:column; justify-content:flex-end; height:100%}
  .dist .b{display:block; width:100%; border-radius:2px 2px 0 0; min-height:2px}
  .ratio{display:flex; height:10px; border-radius:5px; overflow:hidden; margin-top:10px}
  .hotrow{display:grid; grid-template-columns:1fr 62px 62px 76px; gap:6px; padding:5px 0; font-size:13px; cursor:pointer; border-bottom:1px solid rgba(128,128,128,.18)}
  .hotrow:hover{background:var(--hover)}
  .hotrow > span:not(:first-child){text-align:right}
  td.l,th.l{text-align:left; white-space:normal}
  #detail td.l:nth-child(2){white-space:nowrap}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand"><svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="29" fill="none" stroke="var(--accent)" stroke-width="2"/><path d="M14 42l11-12 8 7 15-18" fill="none" stroke="var(--accent)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="48" cy="19" r="3.4" fill="var(--orange)"/></svg><h1>台股看板</h1><div class="en">TAIWAN MARKET BOARD</div><p>上市櫃 ｜ ETF ｜ 日週線分析 ｜ 回測</p></div>
    <nav class="tabs">
      <button class="tab" id="tab-home" aria-pressed="false"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 15L16 5l11 10"/><path d="M8 13v13h16V13"/><path d="M13 26v-8h6v8"/></svg><span>首頁</span></button>
      <button class="tab" id="tab-market" aria-pressed="false"><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="5" y="17" width="4.5" height="9"/><rect x="13.7" y="11" width="4.5" height="15"/><rect x="22.5" y="5" width="4.5" height="21"/></svg><span>看板</span></button>
      <button class="tab" id="tab-hold" aria-pressed="false"><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="4" y="10" width="24" height="16" rx="3"/><path d="M11 10V7.5A2.5 2.5 0 0 1 13.5 5h5A2.5 2.5 0 0 1 21 7.5V10"/><path d="M4 17h24"/></svg><span>持倉</span></button>
      <button class="tab" id="tab-scan" aria-pressed="false"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="14" cy="14" r="8"/><path d="M20 20l7 7"/><path d="M10.5 15l2.5-2.5 2 2 3-3.5"/></svg><span>選股</span></button>
      <button class="tab" id="tab-sector" aria-pressed="false"><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="5" y="5" width="9" height="9" rx="1.5"/><rect x="18" y="5" width="9" height="9" rx="1.5"/><rect x="5" y="18" width="9" height="9" rx="1.5"/><rect x="18" y="18" width="9" height="9" rx="1.5"/></svg><span>類股</span></button>
      <button class="tab" id="tab-ta" aria-pressed="false"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M4 26V6"/><path d="M4 26h24"/><path d="M8 20l5-6 4 3 7-9"/></svg><span>分析</span></button>
      <button class="tab" id="tab-bt" aria-pressed="false"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M7 16a9 9 0 1 0 3-6.7"/><path d="M6 5v6h6"/><path d="M16 11v5.5l3.5 2"/></svg><span>回測</span></button>
    </nav>
    <div class="mkt"><div class="taiex" id="taiex"><span class="v">—</span></div></div>
    <div class="stamp" id="stampbox">
      <div><span class="dot" id="dot"></span> <span id="stamp">載入中…</span></div>
      <div id="sub"></div>
    </div>
  </aside>

  <div class="wrap">

<div class="cols" id="cols">
    <div class="panel">
      <div class="pad">
        <input id="q" type="search" placeholder="代號或名稱，例如 2330、台積"
               autocomplete="off" spellcheck="false">
        <div class="filters">
          <button class="chip" id="t-all"   aria-pressed="true">全部</button>
          <button class="chip" id="t-etf"   aria-pressed="false">ETF</button>
          <button class="chip" id="t-stock" aria-pressed="false">個股</button>
          <span class="sep"></span>
          <button class="chip" id="p-up"    aria-pressed="false">上漲</button>
          <button class="chip" id="p-down"  aria-pressed="false">下跌</button>
          <button class="chip" id="p-watch" aria-pressed="false">★ 自選</button>
          <select id="sort" aria-label="排序">
            <option value="code">依代號</option>
            <option value="pct">漲幅由高到低</option>
            <option value="pct_asc">跌幅由高到低</option>
            <option value="vol">成交量由高到低</option>
          </select>
        </div>
        <div class="count" id="count"></div>
      </div>
      <div class="list" id="list" role="listbox"></div>
    </div>

    <div class="panel" id="detail">
      <div class="empty">從左邊選一檔，或在搜尋框輸入代號。</div>
    </div>
  </div>

  <section class="panel" id="chartdock" hidden aria-label="K 線圖"></section>

  <p class="note" id="note"></p>
  </div>
</div>

<script src="calc.js"></script>
<script src="analysis.js"></script>
<script>
"use strict";
/* Surface script errors on the element so an automated check (and a curious
 * user with devtools closed) can tell the page is broken. */
window.addEventListener("error", (e) => {
  document.documentElement.setAttribute("data-js-error", String(e.message || e.error));
});

const C = window.Calc, A = window.Analysis;
const MAX_ROWS = 200;
const KEY_WATCH = "stockerickl.watch.v1", KEY_LOTS = "stockerickl.lots.v1";

const store = {
  ok: true,
  get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }
             catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }
             catch(e){ store.ok = false; return false; } },
};

const S = {
  index:[], byCode:{}, events:null, globals:null, news:null, evDays:30, quotes:{}, quotesUpdated:null, ind:{}, fund:{}, meta:null, market:null,
  sel:null, view:"home", home:{board:"TWSE", lead:"up", hot:"pct", mine:"watch", news:"tw"}, type:"all", pick:"all", sort:"code", range:250, hist:{},
  watch:new Set(store.get(KEY_WATCH, [])), lots:store.get(KEY_LOTS, []),
  scan:{scope:"all", term:"", busy:false, out:null, list:null, watchOnly:false, sort:{k:"pre", dir:-1}},
  bt:{kind:"ma_cross", a:10, b:30, bars:250, stop:0, cost:true, out:null},
  /* The scan's limits, adjustable and remembered. The STRUCTURE of the setup is fixed in analysis.js. */
  rules:A.normRules(store.get("stockerickl.rules.v1", {})),
  closes:null, closesPromise:null, info:null,         // all-market closes, and the numbers derived from them
  val:null, valBusy:false, valProg:"",                // market-wide validation of the current rules
};

const $ = (id) => document.getElementById(id);
const n2 = (v) => (v === null || v === undefined || Number.isNaN(v)) ? "—" : Number(v).toFixed(2);
const money = (v) => (v === null || v === undefined || Number.isNaN(v)) ? "—" : Math.round(v).toLocaleString("en-US");
const cls = (v) => v > 0 ? "up" : v < 0 ? "down" : "flat";
const sign = (v) => (v === null || v === undefined || Number.isNaN(v)) ? "—" : (v > 0 ? "+" : "") + Number(v).toFixed(2);
const esc = (s) => String(s).replace(/[&<>"']/g, (m) =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));

async function getJSON(path, bust){
  const r = await fetch(path + (bust ? "?t=" + Date.now() : ""), {cache: bust ? "no-store" : "default"});
  if(!r.ok) throw new Error(path + " -> HTTP " + r.status);
  return r.json();
}

/* All-market closes, loaded once and shared by the scan and the validation.
 * The numbers every rule reads are made from them by Analysis.infoFromCloses():
 * the server publishes no MA / RSI / MACD of its own. */
function loadCloses(){
  if(!S.closesPromise){
    S.closesPromise = getJSON("data/closes.json", false)
      .then((cl) => { S.closes = cl; S.info = A.infoFromCloses(cl, S.ind); return cl; })
      .catch((e) => {
        S.closesPromise = null;                                  // allow a retry after a failure
        throw /HTTP 404/.test(String(e && e.message))
          ? new Error("全市場收盤價檔（data/closes.json）還沒建置。請到 GitHub 的 Actions 手動跑一次 site（mode 選 full），或等每個交易日 15:37（台北）的自動重建。")
          : e;
      });
  }
  return S.closesPromise;
}

/* The numbers for ONE symbol, from the same function the scan uses, so the detail
 * panel and the scan cannot show or judge different values. Until its history has
 * loaded only the server-side figures (KD, volume) are available. */
function infoFor(code){
  if(S.info && S.info[code]) return S.info[code];
  const srv = S.ind[code] || {}, h = S.hist[code];
  if(h && h.p && h.p.length){
    const c = A.clean(h, srv.gap), sn = c && A.snapshot(c);
    if(sn) return Object.assign({}, srv, sn);
  }
  return srv;
}

/* ---------------------------------------------------------------- boot */
async function boot(){
  const opt = (p) => getJSON(p, true).catch(() => null);
  try{
    const [idx, q] = await Promise.all([getJSON("data/index.json", true), getJSON("data/quotes.json", true)]);
    S.index = idx.items || [];
    S.byCode = Object.fromEntries(S.index.map((i) => [i.c, i]));
    S.quotes = q.items || {};
    S.quotesUpdated = q;
  }catch(e){
    $("list").innerHTML = '<div class="empty">資料載入失敗：' + esc(e.message) +
      '<br><br>若為本機預覽，請用 <code>python -m http.server -d docs</code> 開啟，' +
      '直接以 file:// 開啟會被瀏覽器擋下。</div>';
    return;
  }
  const [ind, fund, mk, meta, evs, glb, nws] = await Promise.all(
    [opt("data/indicators.json"), opt("data/fundamental.json"), opt("data/market.json"), opt("data/meta.json"), opt("data/events.json"), opt("data/globals.json"), opt("data/news.json")]);
  S.events = evs; S.globals = glb; S.news = nws;
  S.ind = (ind && ind.items) || {};
  S.fund = (fund && fund.items) || {};
  S.market = mk; S.meta = meta;

  const p = new URLSearchParams(location.search);
  if(p.get("q")) $("q").value = p.get("q");
  paintHeader(); paintNote(); render(); if(S.view === "home") setView("home");
  const want = p.get("code");
  if(want && S.byCode[want]) select(want, false);
  if(p.get("view") === "holdings") setView("holdings");
  if(!store.ok) notifyStorage();
}

async function refresh(){
  try{
    const [q, mk, evs, glb, nws] = await Promise.all([getJSON("data/quotes.json", true),
                                       getJSON("data/market.json", true).catch(() => S.market),
                                       getJSON("data/events.json", true).catch(() => S.events),
                                       getJSON("data/globals.json", true).catch(() => S.globals),
                                       getJSON("data/news.json", true).catch(() => S.news)]);
    S.events = evs; S.globals = glb; S.news = nws;
    if(q.updated !== (S.quotesUpdated && S.quotesUpdated.updated)){
      S.quotes = q.items || {}; S.quotesUpdated = q; S.market = mk;
      render();
      if(S.view === "holdings") refreshLotArea(); else if(S.view === "home") paintHome(); else if(S.view === "market" && S.sel) paintDetail(S.sel);
    }
    paintHeader();
  }catch(e){ /* keep showing the last good data */ }
}

/* -------------------------------------------------------------- header */
function paintHeader(){
  const q = S.quotesUpdated || {};
  const age = C.ageMinutes(q.updated, Date.now());
  const clock = (q.updated || "").slice(11, 16);
  let rel = "";
  if(age !== null){
    rel = age < 1 ? "剛剛" : age < 90 ? Math.round(age) + " 分鐘前" :
          age < 2880 ? Math.round(age / 60) + " 小時前" : Math.round(age / 1440) + " 天前";
  }
  $("stamp").textContent = q.updated ? "報價 " + (q.updated.slice(0, 10)) + " " + clock + "（台北）· " + rel : "—";
  const stale = age !== null && age > 30;
  $("stampbox").classList.toggle("old", stale);
  $("dot").className = "dot" + ((q.live_count || 0) && !stale ? "" : " stale");
  const total = Object.keys(S.quotes).length;
  let sub = (q.live_count || 0) + " / " + total + " 檔有盤中報價";
  if(stale) sub += " · 資料較舊（盤後，或排程延遲）";
  if(S.meta && S.meta.history_updated) sub += " · 歷史與指標 " + S.meta.history_updated.slice(0, 10);
  $("sub").textContent = sub;

  const mk = S.market;
  if(mk && mk.close != null){
    $("taiex").innerHTML = '<span style="color:var(--muted);font-size:12.5px">加權指數</span>' +
      '<span class="v ' + cls(mk.chg) + '">' + n2(mk.close) + '</span>' +
      '<span class="' + cls(mk.chg) + '">' + sign(mk.chg) + ' (' + sign(mk.pct) + '%)</span>';
  }
}

function paintNote(){
  const n = S.index.length, etf = S.index.filter((i) => i.k === "ETF").length;
  $("note").innerHTML =
    "涵蓋上市櫃共 <strong>" + n + "</strong> 檔（ETF " + etf + "、個股 " + (n - etf) + "）。" +
    "資料來自 TWSE / TPEx 公開資料與 TWSE MIS 盤中資訊，由 GitHub Actions 於伺服器端定時抓取" +
    "（這些端點皆未開放 CORS，瀏覽器無法直接呼叫），因此是<strong>近即時</strong>而非逐筆即時；" +
    "上方時間為實際顯示的那份報價的時間。" +
    "ETF 沒有本益比等基本面資料（TWSE 未提供），以 — 表示。" +
    "<strong>自選與持倉只存在這個瀏覽器</strong>（localStorage），不會上傳、也不會出現在公開的 repo；" +
    "換裝置或清除網站資料就會消失，請用「匯出」備份。損益<strong>未含手續費與證交稅</strong>。" +
    "僅供參考，不構成投資建議。按 <kbd>/</kbd> 跳到搜尋框。";
}

function notifyStorage(){
  const m = document.createElement("div");
  m.className = "alert"; m.style.margin = "0 0 12px";
  m.textContent = "無法寫入瀏覽器儲存（可能是無痕模式）：自選與持倉在關閉頁面後會消失。";
  document.querySelector(".wrap").insertBefore(m, document.querySelector(".cols"));
}

/* ---------------------------------------------------------------- list */
function results(){
  return C.sortItems(C.filterItems(S.index, {
    term: $("q").value, type: S.type, pick: S.pick, watch: S.watch, quotes: S.quotes,
  }), S.sort, S.quotes);
}

function render(){
  const all = results(), rows = all.slice(0, MAX_ROWS);
  $("count").textContent = all.length + " 檔符合（共 " + S.index.length + " 檔）";
  let html = rows.map(({it}) => {
    const q = S.quotes[it.c] || {}, c = cls(q.pct), on = S.watch.has(it.c);
    return '<div class="row" data-code="' + esc(it.c) + '" role="option" aria-selected="' + (S.sel === it.c) + '">' +
      '<div class="code"><span class="star' + (on ? " on" : "") + '" data-star="' + esc(it.c) +
        '" title="' + (on ? "移出自選" : "加入自選") + '">' + (on ? "★" : "☆") + '</span> ' + esc(it.c) +
        '<span class="kind">' + (it.k === "ETF" ? "ETF" : "股") + '</span>' +
        (q.live ? "" : ' <span class="flat" title="無盤中報價，顯示最後收盤">·</span>') + '</div>' +
      '<div class="px ' + c + '">' + n2(q.last) + '</div>' +
      '<div class="name">' + esc(it.n || "") + '</div>' +
      '<div class="pct ' + c + '">' + sign(q.pct) + '%</div></div>';
  }).join("");
  if(all.length > MAX_ROWS) html += '<div class="more">僅顯示前 ' + MAX_ROWS + ' 筆，請輸入更多字或加上篩選縮小範圍。</div>';
  $("list").innerHTML = html || '<div class="empty">' +
    (S.pick === "watch" && !S.watch.size ? "還沒有自選。點列表裡的 ☆ 加入。" : "沒有符合的標的。") + '</div>';
}

/* -------------------------------------------------------------- detail */
async function select(code, scroll){
  S.sel = code; if(S.view === "holdings" || S.view === "scan" || S.view === "home") S.view = "market"; syncTabs();
  try{ const u = new URL(location.href); u.searchParams.set("code", code); history.replaceState(null, "", u); }catch(e){}
  render(); paintCurrent();
  if(scroll !== false && window.innerWidth < 860) $("detail").scrollIntoView({behavior:"smooth", block:"start"});
  if(S.hist[code] === undefined){
    try{ S.hist[code] = await getJSON("data/history/" + encodeURIComponent(code) + ".json"); }
    catch(e){ S.hist[code] = null; }
  }
  if(S.sel === code) paintCurrent();
}

function paintDetail(code){
  const it = S.byCode[code] || {c:code, n:"", b:"", k:""};
  const q = S.quotes[code] || {}, d = infoFor(code), c = cls(q.pct), on = S.watch.has(code);
  const f = S.fund[code];
  const cell = (k, v) => '<div class="cell"><div class="k">' + k + '</div><div class="v">' + v + '</div></div>';

  let fundHtml = "";
  if(it.k === "ETF") fundHtml = '<div class="sub">ETF 沒有本益比等基本面資料（TWSE 未提供）。</div>';
  else fundHtml = '<div class="grid">' + cell("本益比", f ? n2(f[0]) : "—") +
        cell("殖利率 %", f ? n2(f[1]) : "—") + cell("股價淨值比", f ? n2(f[2]) : "—") + '</div>';

  const gap = d.gap ? '<div class="alert">⚠ 價格序列在 <strong>' + esc(d.gap.date) + '</strong> 出現異常跳空（前後收盤比約 ' +
    esc(d.gap.ratio) + ' 倍）：可能是分割、反分割、減資，也可能是資料錯誤，無法由資料判斷。' +
    '此日之前的資料<strong>未採用</strong>，下方指標與走勢圖只涵蓋此日之後。</div>' : "";

  $("detail").innerHTML = '<div class="pad">' +
    '<div class="head"><span class="sym">' + esc(it.c) + ' ' + esc(it.n || "") + '</span>' +
      '<button class="starbtn' + (on ? " on" : "") + '" id="d-star" title="自選">' + (on ? "★" : "☆") + '</button>' +
      '<span class="tag">' + (it.b === "TWSE" ? "上市" : "上櫃") + '</span>' +
      '<span class="tag">' + (it.k === "ETF" ? "ETF" : "個股") + '</span>' +
      (q.live ? "" : '<span class="tag">收盤值</span>') +
      '<button class="act" id="d-add">＋ 加入持倉</button></div>' +
    '<div class="head" style="margin-top:6px"><span class="big ' + c + '">' + n2(q.last) + '</span>' +
      '<span class="' + c + '" style="font-size:16px">' + sign(q.chg) + ' (' + sign(q.pct) + '%)</span>' +
      '<span style="color:var(--muted);font-size:12.5px">' + (q.time ? "成交時間 " + esc(q.time) : "") + '</span></div>' +
    '<div class="grid">' +
      cell("開盤", n2(q.open)) + cell("最高", n2(q.high)) + cell("最低", n2(q.low)) + cell("昨收", n2(q.prev)) +
      cell("成交量(張)", q.vol == null ? "—" : Math.round(q.vol).toLocaleString()) + '</div>' +
    fundHtml + gap +
    '<div class="sub">技術指標' + (d.date ? "（資料至 " + esc(d.date) + "）" : "") + '</div>' +
    '<div class="grid">' +
      cell("MA5", n2(d.ma5)) + cell("MA20", n2(d.ma20)) + cell("MA60", n2(d.ma60)) + cell("MA240", n2(d.ma240)) +
      cell("KD (K/D)", n2(d.k) + " / " + n2(d.d)) + cell("RSI14", n2(d.rsi)) +
      cell("MACD柱", n2(d.hist)) + cell("量比", n2(d.vol_ratio)) + '</div>' +
    '<div class="ranges">' + [[20,"1月"],[60,"3月"],[120,"6月"],[250,"1年"]].map(([v,l]) =>
      '<button class="chip r" data-r="' + v + '" aria-pressed="' + (S.range === v) + '">' + l + '</button>').join("") + '</div>' +
    chart(S.hist[code], S.range) + '</div>';
}

/* Inline SVG so the page has no CDN dependency and works offline. */
function chart(h, days){
  if(h === undefined) return '<div class="empty">載入走勢…</div>';
  if(h === null || !h.p || !h.p.length) return '<div class="empty">無歷史資料（新上市，或歷史資料尚未更新）。</div>';
  const p = h.p.slice(-days).map(Number), dts = h.d.slice(-days);
  const pts = p.filter((v) => Number.isFinite(v));
  if(pts.length < 2) return '<div class="empty">歷史資料不足以繪圖。</div>';
  const W = 820, H = 260, L = 52, R = 10, T = 12, B = 26;
  const lo = Math.min(...pts), hi = Math.max(...pts), span = (hi - lo) || 1;
  const x = (i) => L + i * (W - L - R) / Math.max(1, p.length - 1);
  const y = (v) => T + (hi - v) * (H - T - B) / span;
  const line = p.map((v, i) => Number.isFinite(v) ? (i ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1) : "").join(" ");
  const area = "M" + x(0).toFixed(1) + " " + (H - B) + " " +
    p.map((v, i) => Number.isFinite(v) ? "L" + x(i).toFixed(1) + " " + y(v).toFixed(1) : "").join(" ") +
    " L" + x(p.length - 1).toFixed(1) + " " + (H - B) + " Z";
  const col = p[p.length - 1] >= pts[0] ? "var(--up)" : "var(--down)";
  const ticks = [hi, lo + span / 2, lo].map((v) =>
    '<g><line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v).toFixed(1) + '" y2="' + y(v).toFixed(1) +
    '" stroke="var(--line)" stroke-dasharray="3 3"/><text x="' + (L - 8) + '" y="' + (y(v) + 4).toFixed(1) +
    '" text-anchor="end" font-size="11" fill="var(--muted)">' + v.toFixed(2) + '</text></g>').join("");
  /* Anchor the end labels inward; a centred label on the last point is clipped by the viewBox. */
  const lab = (i, anchor) => '<text x="' + x(i).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="' + anchor +
    '" font-size="11" fill="var(--muted)">' + (dts[i] || "").slice(2) + '</text>';
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="收盤走勢圖"><defs>' +
    '<linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + col + '" stop-opacity=".22"/>' +
    '<stop offset="1" stop-color="' + col + '" stop-opacity="0"/></linearGradient></defs>' + ticks +
    '<path d="' + area + '" fill="url(#g)"/><path d="' + line + '" fill="none" stroke="' + col +
    '" stroke-width="1.8" stroke-linejoin="round"/>' + lab(0, "start") + lab(Math.floor(p.length / 2), "middle") + lab(p.length - 1, "end") + '</svg>';
}


/* ------------------------------------------------- scan / analysis / backtest */
const pc = (v, d) => v == null || Number.isNaN(v) ? "—" : (v * 100).toFixed(d == null ? 1 : d) + "%";
const pf = (v) => v == null ? "—" : v === Infinity ? "∞（無虧損單）" : v.toFixed(2);
const DISCLAIMER = '<div class="note">依收盤價與公開指標以固定規則運算，不含新聞與財報內容；歷史勝率是<strong>這檔過去同型態</strong>的回放，' +
  '不是未來保證。停損、目標以收盤判斷，盤中觸價看不到。僅供參考，不構成投資建議。</div>';

function codeBar(){
  return '<div class="bar"><div><label for="v-code">代號</label><input id="v-code" value="' + esc(S.sel || "") +
    '" placeholder="例如 2330" autocomplete="off"></div><button class="btn ghost" id="v-go">前往</button></div>';
}
function goCode(){
  const c = ($("v-code").value || "").trim().toUpperCase();
  if(S.byCode[c]) select(c, false);
  else if($("v-msg")) $("v-msg").textContent = "找不到代號 " + (c || "（空白）") + "：只支援上市櫃的股票與 ETF。";
}
function needHist(){
  if(!S.sel) return '<div class="empty">從左邊選一檔，或在上方輸入代號。</div>';
  const h = S.hist[S.sel];
  if(h === undefined) return '<div class="empty">載入歷史資料…</div>';
  const c = h && A.clean(h, (S.ind[S.sel] || {}).gap);
  if(!c || c.p.length < 60) return '<div class="empty">歷史資料不足（至少需要 60 個交易日）。</div>';
  return null;
}

/* ---- 1. scan */
async function runScan(){
  const sc = S.scan;
  if(sc.busy){ sc.again = true; return; }                     // a rule changed mid-scan: run once more when this one ends
  readScanFilters();
  sc.busy = true; sc.out = null; sc.list = null; sc.prog = S.closes ? "預選中…" : "載入全市場收盤價…"; paintScan();
  const tick = () => new Promise((r) => setTimeout(r, 0));   // let the browser repaint the progress text
  try{
    await tick();
    await loadCloses();                                       // first use downloads the all-market closes once
    sc.prog = "預選中…"; paintScan(); await tick();
    /* S.info is built from the closes by the same function the detail panel uses; S.rules are the user's limits. */
    const scanOpts = {scope: sc.scope, term: sc.term, ind: S.info, quotes: S.quotes, rules: S.rules};
    const cands = A.candidates(S.index, scanOpts);
    /* Everything that passes the first pass, whatever scope/keyword is typed: the table below filters it live. */
    sc.list = A.candidates(S.index, Object.assign({}, scanOpts, {scope: "all", term: ""}));
    /* For a typed code: which matches were dropped by the first pass, and why. */
    const why = A.explain(S.index, scanOpts);
    const top = cands.slice(0, 30);
    const found = [], drops = [];
    let done = 0;
    /* 6 fetches at a time, each capped at 15s, so one stalled file cannot hang the scan. */
    const queue = top.slice();
    const worker = async () => {
      while(queue.length){
        const {it} = queue.shift();
        await Promise.race([loadHist(it.c), new Promise((r) => setTimeout(r, 15000))]);
        done++; sc.prog = "載入歷史 " + done + " / " + top.length;
        if(S.view === "scan") paintScan();
      }
    };
    await Promise.all(Array.from({length: Math.min(6, top.length)}, worker));
    for(const {it} of top){
      try{
        const x = A.evaluateWhy(it, S.hist[it.c], S.quotes[it.c], S.info[it.c], S.fund[it.c], S.rules);
        if(x.r) found.push(x.r); else drops.push({it, reason: x.reason});
      }catch(e){
        console.error("scan evaluate failed for " + it.c, e);
        drops.push({it, reason: "檢驗時發生錯誤（詳見瀏覽器主控台）"});
      }
      if(S.hist[it.c] === undefined) S.hist[it.c] = null;     // timed-out fetch: don't leave "loading" state
    }
    found.sort((a, b) => b.score - a.score);
    /* The second-gate drops are only worth showing when the user named something specific. */
    sc.out = {pre: cands.length, checked: top.length, items: found.slice(0, 5), why, drops: why ? drops : []};
  }catch(e){
    console.error("scan failed", e);
    sc.out = {pre: 0, checked: 0, items: [], err: String(e && e.message || e)};
  }finally{
    sc.busy = false;
    if(S.view === "scan") paintScan();
    if(sc.again){ sc.again = false; runScan(); }
  }
}

/* Why the symbols the user typed did not make the list. Reasons come from the
 * same rules that did the filtering (Analysis.rejection / evaluateWhy), so they
 * cannot disagree with it. */
function whyBlock(o, term){
  const w = o.why;
  if(!w) return "";                                   // nothing typed: a market-wide scan has no one to explain
  if(!w.matched)
    return '<div class="empty">找不到代號或名稱符合「' + esc(term) + '」的標的。請確認代號，或把「範圍」改成「全部」。</div>';
  const rows = w.rejected.map((x) => ({it: x.it, gate: "預選", reason: x.reason}))
    .concat((o.drops || []).map((x) => ({it: x.it, gate: "細查", reason: x.reason})));
  if(!rows.length) return "";
  return '<div class="sub" style="margin-top:16px">你輸入的標的裡，沒入選的與原因</div><ul class="why">' +
    rows.map((x) => '<li><strong>' + esc(x.it.c) + ' ' + esc(x.it.n || "") + '</strong>（' + x.gate + '）' + esc(x.reason) +
      ' <button class="act" data-go="ta" data-code="' + esc(x.it.c) + '">看分析</button></li>').join("") + '</ul>' +
    (w.more > 0 ? '<div class="note">另有 ' + w.more + ' 檔也沒入選，請輸入更精確的代號來看原因。</div>' : "") +
    '<div class="note">這些條件只用來「找出現在適合進場的型態」；<strong>「分析」分頁不受它們限制，任何代號都能看。</strong></div>';
}

/* ---- the list of EVERYTHING the first pass selected, filterable and sortable.
 * Pure in-memory work on S.info / S.quotes, so filters apply as you type. */
const SCAN_COLS = [["c","代號"],["pct","漲跌"],["rsi","RSI"],["ext","高於20日線"],["lots","均量(張)"],["pre","排序分"]];
const SCAN_CAP = 300;
function scanRows(){
  const sc = S.scan; if(!sc.list) return [];
  const o = {scope: sc.scope}, terms = A.splitTerms(sc.term);
  const rows = [];
  for(const {it, pre} of sc.list){
    if(!A.inScope(it, o, terms)) continue;
    if(sc.watchOnly && !S.watch.has(it.c)) continue;
    const d = S.info[it.c] || {}, q = S.quotes[it.c] || {}, last = q.last > 0 ? q.last : d.close;
    rows.push({it, pre, q, last, rsi: d.rsi, ext: d.ma20 ? (last / d.ma20 - 1) * 100 : null,
      lots: d.avg_lots != null ? d.avg_lots : q.vol, pct: q.pct, c: it.c});
  }
  const k = sc.sort.k, dir = sc.sort.dir;
  rows.sort((a, b) => {
    const x = a[k], y = b[k];
    if(x == null && y == null) return 0; if(x == null) return 1; if(y == null) return -1;
    return (x < y ? -1 : x > y ? 1 : 0) * dir;
  });
  return rows;
}

/* ---- shared multi-line SVG chart */
function lineSvg(dts, series, hl){
  const n = dts.length, W = 820, H = 280, L = 52, R = 56, T = 12, B = 26;
  const vals = [];
  series.forEach((s) => s.v.forEach((v) => { if(Number.isFinite(v)) vals.push(v); }));
  hl.forEach((h) => vals.push(h.y));
  const lo0 = Math.min(...vals), hi0 = Math.max(...vals), pad = (hi0 - lo0) * 0.04 || 1;
  const lo = lo0 - pad, hi = hi0 + pad, span = hi - lo;
  const x = (i) => L + i * (W - L - R) / Math.max(1, n - 1), y = (v) => T + (hi - v) * (H - T - B) / span;
  let g = "";
  [hi, lo + span / 2, lo].forEach((v) => {
    g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v).toFixed(1) + '" y2="' + y(v).toFixed(1) + '" stroke="var(--line)" stroke-dasharray="3 3"/>' +
      '<text x="' + (L - 8) + '" y="' + (y(v) + 4).toFixed(1) + '" text-anchor="end" font-size="11" fill="var(--muted)">' + v.toFixed(2) + '</text>';
  });
  hl.forEach((h) => {
    g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(h.y).toFixed(1) + '" y2="' + y(h.y).toFixed(1) + '" stroke="' + h.c + '" stroke-dasharray="6 4" opacity=".8"/>' +
      '<text x="' + (W - R + 4) + '" y="' + (y(h.y) + 4).toFixed(1) + '" font-size="10.5" fill="' + h.c + '">' + h.y.toFixed(2) + '</text>';
  });
  series.forEach((s) => {
    let d = "", pen = false;
    s.v.forEach((v, i) => {
      if(!Number.isFinite(v)){ pen = false; return; }
      d += (pen ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1) + " "; pen = true;
    });
    g += '<path d="' + d + '" fill="none" stroke="' + s.c + '" stroke-width="' + (s.w || 1.4) + '"' + (s.dash ? ' stroke-dasharray="' + s.dash + '"' : "") + ' stroke-linejoin="round"/>';
  });
  const lab = (i, a) => '<text x="' + x(i).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="' + a + '" font-size="11" fill="var(--muted)">' + (dts[i] || "").slice(2) + '</text>';
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="走勢圖">' + g + lab(0, "start") + lab(Math.floor(n / 2), "middle") + lab(n - 1, "end") + '</svg>';
}
function chartBox(dts, series, hl){
  const leg = '<div class="legend">' + series.filter((s) => s.name).map((s) => '<span><i style="background:' + s.c + '"></i>' + s.name + '</span>').join("") +
    hl.map((h) => '<span><i style="background:' + h.c + '"></i>' + h.name + '</span>').join("") + '</div>';
  return leg + lineSvg(dts, series, hl);
}

/* ---- the big interactive chart (daily / weekly candles + volume + RSI + MACD), in a panel below.
 * Prices, indicators and the per-day numbers all come from analysis.js (A.bars, A.series, A.barInfo),
 * the same functions the scan uses, so the chart cannot show different numbers from the verdict. */
const CH = {tf:"D", view:null, cursor:null, pinned:false, data:null, code:null, tfShown:null, drag:null, geo:null, an:null};
const CH_L = 58, CH_R = 66;

function chData(code, tf){
  const c = A.clean(S.hist[code], (S.ind[code] || {}).gap);
  const key = code + "|" + tf + "|" + (c.o ? "o" : "-") + "|" + c.p.length + "|" + c.d[c.d.length - 1];
  if(CH.data && CH.data.key === key) return CH.data;
  const b = A.bars(c);
  const bs = tf === "W" ? A.weeklyBars(b.bars) : b.bars;
  CH.data = {key, bs, real: b.real, hasVol: bs.some((x) => x.v != null), ser: A.series(bs.map((x) => x.c))};
  return CH.data;
}
const chDefaultCount = () => CH.tf === "D" ? 150 : 80;

function paintDock(an, below){
  const dock = $("chartdock"), code = S.sel, d = chData(code, CH.tf), n = d.bs.length;
  CH.an = an; if(below !== undefined) CH.below = below;
  if(CH.code !== code || CH.tfShown !== CH.tf || !CH.view){
    CH.view = A.lastView(n, chDefaultCount()); CH.cursor = n - 1; CH.pinned = false; CH.code = code; CH.tfShown = CH.tf;
  }else{
    CH.view = A.clampView(CH.view, n);
    if(CH.cursor == null || CH.cursor >= n) CH.cursor = n - 1;
  }
  const btn = (attr, val, label, on) => '<button class="chip" ' + attr + '="' + val + '" aria-pressed="' + on + '">' + label + '</button>';
  const it = S.byCode[code];
  dock.hidden = false;
  dock.innerHTML = '<div class="pad"><div class="head"><span class="sym">K 線圖</span>' +
    (it ? '<span class="tag">' + esc(it.c) + ' ' + esc(it.n || "") + '</span>' : "") + '</div>' +
    '<div class="chbar">' + btn("data-ch-tf", "D", "日線", CH.tf === "D") + btn("data-ch-tf", "W", "週線", CH.tf === "W") + '<span class="sep"></span>' +
    [["63", "3 個月"], ["126", "6 個月"], ["252", "1 年"], ["all", "全部"]].map(([v, l]) => btn("data-ch-range", v, l, false)).join("") +
    '<button class="act" data-ch-reset="1">還原</button>' +
    '<span class="flat chhint">滾輪縮放 · 拖曳平移 · 點一下固定該日（再點取消）· 雙擊還原 · 鍵盤 ← → + −</span></div>' +
    (d.real ? "" : '<div class="alert">這檔的歷史資料還沒有開高低量（要等下一次完整建置），先以收盤折線顯示。</div>') +
    '<div id="ch-info" aria-live="polite"></div>' +
    '<div id="ch-wrap" tabindex="0" aria-label="K 線圖，可用方向鍵逐日查看"></div>' +
    '<div class="note">紅漲綠跌。MA5 橘、MA20 紫、MA60 青；虛線為壓力（紅）／支撐（綠）與趨勢通道。' +
    '週線由日線的開高低收量合併（週一為一週之始）。成交量單位為張。指標用收盤價計算，和選股、分析的判斷是同一套。</div></div>' + (CH.below || "");
  drawChart();
}

function chScale(lo, hi, top, h, pad){
  const span = (hi - lo) || 1, l = lo - span * pad, u = hi + span * pad, sp = u - l;
  return {lo: l, hi: u, y: (v) => top + (u - v) * h / sp};
}

function drawChart(){
  const wrap = $("ch-wrap"); if(!wrap || !CH.data) return;
  const d = CH.data, bs = d.bs, ser = d.ser, v = CH.view, a = v.a, b = v.b, cnt = b - a;
  const W = Math.max(320, wrap.clientWidth || 900), small = W < 600;
  const L = CH_L, R = CH_R, T = 8, GAP = 10;
  const Hp = small ? 260 : 380, Hv = d.hasVol ? 80 : 0, Hr = 90, Hm = 100, AX = 22;
  const yP = T, yV = yP + Hp + (Hv ? GAP : 0), yR = yV + Hv + GAP, yM = yR + Hr + GAP, H = yM + Hm + AX;
  const step = (W - L - R) / cnt, xc = (i) => L + (i - a + 0.5) * step;
  const bw = Math.max(1, Math.min(step * 0.72, 18));
  const num = (x, k) => Number(x).toFixed(k == null ? 2 : k);
  let g = "";

  /* price scale: visible highs/lows and the visible moving averages */
  let lo = Infinity, hi = -Infinity;
  for(let i = a; i < b; i++){
    lo = Math.min(lo, bs[i].l); hi = Math.max(hi, bs[i].h);
    for(const k of ["ma5", "ma20", "ma60"]){ const m = ser[k][i]; if(Number.isFinite(m)){ lo = Math.min(lo, m); hi = Math.max(hi, m); } }
  }
  const P = chScale(lo, hi, yP, Hp, 0.04);
  for(let k = 0; k <= 4; k++){
    const val = P.lo + (P.hi - P.lo) * k / 4, yy = P.y(val).toFixed(1);
    g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + yy + '" y2="' + yy + '" stroke="var(--line)" stroke-dasharray="3 3"/>' +
      '<text x="' + (L - 6) + '" y="' + (+yy + 4) + '" text-anchor="end" font-size="11" fill="var(--muted)">' + num(val) + '</text>';
  }
  const path = (arr, y, color, w, dash) => {
    let s = "", pen = false;
    for(let i = a; i < b; i++){
      const val = arr[i];
      if(!Number.isFinite(val)){ pen = false; continue; }
      s += (pen ? "L" : "M") + xc(i).toFixed(1) + " " + y(val).toFixed(1) + " "; pen = true;
    }
    return s ? '<path d="' + s + '" fill="none" stroke="' + color + '" stroke-width="' + w + '"' + (dash ? ' stroke-dasharray="' + dash + '"' : "") + ' stroke-linejoin="round"/>' : "";
  };
  /* support / resistance and the trend channel: daily only (they were computed on daily closes) */
  if(CH.tf === "D" && CH.an){
    const line = (price, color, label) => {
      if(price < P.lo || price > P.hi) return "";
      const yy = P.y(price).toFixed(1);
      return '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + yy + '" y2="' + yy + '" stroke="' + color + '" stroke-dasharray="6 4" opacity=".75"/>' +
        '<text x="' + (W - R + 4) + '" y="' + (+yy + 4) + '" font-size="10.5" fill="' + color + '">' + label + ' ' + num(price) + '</text>';
    };
    CH.an.levels.resistances.slice(0, 2).forEach((l) => { g += line(l.price, "var(--up)", "壓"); });
    CH.an.levels.supports.slice(0, 2).forEach((l) => { g += line(l.price, "var(--down)", "撐"); });
    const tr = CH.an.trend;
    if(tr && Number.isFinite(tr.slope)){
      const fit = bs.map((_, i) => i < tr.x0 ? null : tr.icpt + tr.slope * (i - tr.x0));
      g += path(fit.map((x) => x == null ? null : x + 2 * tr.sigma), P.y, "var(--accent)", 1, "2 3") +
           path(fit.map((x) => x == null ? null : x - 2 * tr.sigma), P.y, "var(--accent)", 1, "2 3");
    }
  }
  if(d.real){
    for(let i = a; i < b; i++){
      const x = bs[i], up = x.c > x.o, dn = x.c < x.o, col = up ? "var(--up)" : dn ? "var(--down)" : "var(--muted)";
      const yo = P.y(x.o), yc = P.y(x.c);
      g += '<line x1="' + xc(i).toFixed(1) + '" x2="' + xc(i).toFixed(1) + '" y1="' + P.y(x.h).toFixed(1) + '" y2="' + P.y(x.l).toFixed(1) + '" stroke="' + col + '"/>' +
        '<rect x="' + (xc(i) - bw / 2).toFixed(1) + '" y="' + Math.min(yo, yc).toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + Math.max(1, Math.abs(yo - yc)).toFixed(1) + '" fill="' + col + '"/>';
    }
  }else g += path(bs.map((x) => x.c), P.y, "var(--ink)", 1.7);
  g += path(ser.ma5, P.y, "#e0a100", 1.1) + path(ser.ma20, P.y, "#9333ea", 1.3) + path(ser.ma60, P.y, "#0d9488", 1.3);

  const title = (y0, t) => '<text x="' + (L + 4) + '" y="' + (y0 + 12) + '" font-size="11" fill="var(--muted)">' + t + '</text>';
  /* volume */
  if(Hv){
    let vm = 0; for(let i = a; i < b; i++) vm = Math.max(vm, bs[i].v || 0);
    vm = vm || 1;
    g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + (yV + Hv) + '" y2="' + (yV + Hv) + '" stroke="var(--line)"/>' + title(yV, "成交量（張）") +
      '<text x="' + (L - 6) + '" y="' + (yV + 10) + '" text-anchor="end" font-size="11" fill="var(--muted)">' + Math.round(vm).toLocaleString("en-US") + '</text>';
    for(let i = a; i < b; i++){
      const x = bs[i]; if(x.v == null) continue;
      const hh = x.v / vm * (Hv - 14);
      g += '<rect x="' + (xc(i) - bw / 2).toFixed(1) + '" y="' + (yV + Hv - hh).toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + Math.max(0.5, hh).toFixed(1) +
        '" fill="' + (x.c > x.o ? "var(--up)" : x.c < x.o ? "var(--down)" : "var(--muted)") + '" opacity=".65"/>';
    }
  }
  /* RSI */
  const R_ = chScale(0, 100, yR, Hr, 0.02);
  g += title(yR, "RSI(14)");
  [30, 50, 70].forEach((lv) => {
    const yy = R_.y(lv).toFixed(1);
    g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + yy + '" y2="' + yy + '" stroke="var(--line)" stroke-dasharray="' + (lv === 50 ? "1 4" : "3 3") + '"/>' +
      '<text x="' + (L - 6) + '" y="' + (+yy + 4) + '" text-anchor="end" font-size="11" fill="var(--muted)">' + lv + '</text>';
  });
  g += path(ser.rsi, R_.y, "#2563eb", 1.4);
  /* MACD */
  let mm = 0.0001;
  for(let i = a; i < b; i++) for(const k of ["dif", "dea", "hist"]){ const q = ser.macd[k][i]; if(Number.isFinite(q)) mm = Math.max(mm, Math.abs(q)); }
  const M = chScale(-mm, mm, yM, Hm, 0.06), y0 = M.y(0).toFixed(1);
  g += title(yM, "MACD(12,26,9)  柱＝DIF−DEA") + '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y0 + '" y2="' + y0 + '" stroke="var(--line)"/>' +
    '<text x="' + (L - 6) + '" y="' + (+y0 + 4) + '" text-anchor="end" font-size="11" fill="var(--muted)">0</text>';
  for(let i = a; i < b; i++){
    const q = ser.macd.hist[i]; if(!Number.isFinite(q)) continue;
    const yq = M.y(q);
    g += '<rect x="' + (xc(i) - bw / 2).toFixed(1) + '" y="' + Math.min(yq, +y0).toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + Math.max(0.5, Math.abs(yq - y0)).toFixed(1) +
      '" fill="' + (q >= 0 ? "var(--up)" : "var(--down)") + '" opacity=".6"/>';
  }
  g += path(ser.macd.dif, M.y, "#e0a100", 1.2) + path(ser.macd.dea, M.y, "#9333ea", 1.2);
  /* dates along the bottom */
  for(let k = 0; k <= 5; k++){
    const i = Math.min(b - 1, a + Math.round((cnt - 1) * k / 5));
    g += '<text x="' + xc(i).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="' + (k === 0 ? "start" : k === 5 ? "end" : "middle") + '" font-size="11" fill="var(--muted)">' + bs[i].d.slice(2) + '</text>';
  }
  g += '<line id="ch-x" y1="' + T + '" y2="' + (yM + Hm) + '" stroke="var(--ink)" stroke-width="1" opacity=".55" stroke-dasharray="4 3" visibility="hidden"/>';
  CH.geo = {W, L, R, step, a, b, xc};
  wrap.innerHTML = '<svg id="ch-svg" viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '" role="img" aria-label="K 線與指標圖">' + g + '</svg>';
  updateCursor();
}

function chInfoHtml(inf, prevClose){
  const cell = (k, val, c) => '<span class="ic"><i>' + k + '</i><b class="' + (c || "") + '">' + val + '</b></span>';
  const f = (x, k) => x == null ? "—" : Number(x).toFixed(k == null ? 2 : k);
  const vs = (x) => prevClose == null ? "" : cls(x - prevClose);
  return cell("日期", esc(inf.d)) + cell("開", f(inf.o), vs(inf.o)) + cell("高", f(inf.h), vs(inf.h)) + cell("低", f(inf.l), vs(inf.l)) + cell("收", f(inf.c), vs(inf.c)) +
    cell("漲跌", inf.chg == null ? "—" : sign(inf.chg) + " (" + sign(inf.chgPct) + "%)", cls(inf.chg)) +
    cell("成交量(張)", inf.v == null ? "—" : Math.round(inf.v).toLocaleString("en-US")) +
    cell("MA5", f(inf.ma5)) + cell("MA20", f(inf.ma20)) + cell("MA60", f(inf.ma60)) + cell("RSI", f(inf.rsi, 1)) +
    cell("DIF", f(inf.dif, 3)) + cell("DEA", f(inf.dea, 3)) + cell("柱", f(inf.hist, 3), cls(inf.hist)) +
    (CH.pinned ? '<span class="tag">已固定</span>' : "");
}
function updateCursor(){
  if(!CH.data || !CH.geo) return;
  const bs = CH.data.bs, i = CH.cursor, inf = A.barInfo(bs, CH.data.ser, i), info = $("ch-info");
  if(info && inf) info.innerHTML = chInfoHtml(inf, i > 0 ? bs[i - 1].c : null);
  const xl = $("ch-x");
  if(xl){
    if(i >= CH.geo.a && i < CH.geo.b){ const x = CH.geo.xc(i).toFixed(1); xl.setAttribute("x1", x); xl.setAttribute("x2", x); xl.setAttribute("visibility", "visible"); }
    else xl.setAttribute("visibility", "hidden");
  }
}
function chIndexAt(e){
  const svg = $("ch-svg"), G = CH.geo; if(!svg || !G) return null;
  const r = svg.getBoundingClientRect(), x = (e.clientX - r.left) * (G.W / r.width);
  return Math.max(G.a, Math.min(G.b - 1, G.a + Math.floor((x - G.L) / G.step)));
}
let chRaf = 0;
const chRedraw = () => { if(!chRaf) chRaf = requestAnimationFrame(() => { chRaf = 0; drawChart(); }); };
function chSetView(v){ CH.view = v; chRedraw(); }

(function wireChart(){
  const dock = $("chartdock");
  dock.addEventListener("pointerdown", (e) => {
    const w = e.target.closest("#ch-wrap"); if(!w || e.button > 0) return;
    CH.drag = {x: e.clientX, a0: CH.view.a, moved: false};
    try{ w.setPointerCapture(e.pointerId); }catch(_){}
  });
  dock.addEventListener("pointermove", (e) => {
    if(!CH.data || !CH.geo) return;
    const dr = CH.drag;
    if(dr){
      const dx = e.clientX - dr.x;
      if(Math.abs(dx) > 4) dr.moved = true;
      if(dr.moved){
        const w = CH.view.b - CH.view.a, bars = -Math.round(dx / CH.geo.step);
        CH.view = A.panView({a: dr.a0, b: dr.a0 + w}, CH.data.bs.length, bars); chRedraw();
      }
      return;
    }
    if(!CH.pinned && e.target.closest("#ch-wrap")){ const i = chIndexAt(e); if(i != null && i !== CH.cursor){ CH.cursor = i; updateCursor(); } }
  });
  const end = (e) => {
    const dr = CH.drag; CH.drag = null;
    if(dr && !dr.moved && CH.data){
      const i = chIndexAt(e);
      if(i != null){ if(CH.pinned && CH.cursor === i) CH.pinned = false; else{ CH.cursor = i; CH.pinned = true; } updateCursor(); }
    }
  };
  dock.addEventListener("pointerup", end);
  dock.addEventListener("pointercancel", () => { CH.drag = null; });
  dock.addEventListener("wheel", (e) => {
    if(!e.target.closest("#ch-wrap") || !CH.data) return;
    e.preventDefault();
    const G = CH.geo, r = $("ch-svg").getBoundingClientRect();
    const focus = Math.max(0, Math.min(1, ((e.clientX - r.left) * (G.W / r.width) - G.L) / (G.W - G.L - G.R)));
    chSetView(A.zoomView(CH.view, CH.data.bs.length, focus, e.deltaY < 0 ? 0.8 : 1.25));
  }, {passive: false});
  dock.addEventListener("dblclick", (e) => { if(e.target.closest("#ch-wrap") && CH.data) chSetView(A.lastView(CH.data.bs.length, chDefaultCount())); });
  dock.addEventListener("keydown", (e) => {
    if(!e.target.closest("#ch-wrap") || !CH.data) return;
    const n = CH.data.bs.length;
    if(e.key === "ArrowLeft" || e.key === "ArrowRight"){
      e.preventDefault(); CH.pinned = true;
      CH.cursor = Math.max(0, Math.min(n - 1, CH.cursor + (e.key === "ArrowLeft" ? -1 : 1)));
      if(CH.cursor < CH.view.a) chSetView(A.panView(CH.view, n, CH.cursor - CH.view.a));
      else if(CH.cursor >= CH.view.b) chSetView(A.panView(CH.view, n, CH.cursor - CH.view.b + 1));
      updateCursor();
    }else if(e.key === "+" || e.key === "=" || e.key === "-"){
      e.preventDefault(); chSetView(A.zoomView(CH.view, n, 0.5, e.key === "-" ? 1.25 : 0.8));
    }
  });
  dock.addEventListener("click", (e) => {
    const t = e.target, tf = t.closest("[data-ch-tf]"), rg = t.closest("[data-ch-range]");
    if(tf){ CH.tf = tf.dataset.chTf; paintDock(CH.an); return; }
    if(rg && CH.data){ const n = CH.data.bs.length, c = rg.dataset.chRange; chSetView(A.lastView(n, c === "all" ? n : (CH.tf === "W" ? Math.round(+c / 5) : +c))); return; }
    if(t.closest("[data-ch-reset]") && CH.data) chSetView(A.lastView(CH.data.bs.length, chDefaultCount()));
  });
  let rt = 0;
  window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { if(!dock.hidden) drawChart(); }, 150); });
})();

/* ---- 2. daily + weekly analysis */
function paintTA(){
  const code = S.sel, it = S.byCode[code];
  const head = '<div class="pad"><div class="head"><span class="sym">日線＋週線分析</span>' +
    (it ? '<span class="tag">' + esc(it.c) + ' ' + esc(it.n || "") + '</span>' : "") + '</div>' + codeBar() + '<div class="msg err" id="v-msg"></div>';
  const bad = needHist();
  if(bad){ $("detail").innerHTML = head + bad + '</div>'; $("chartdock").hidden = true; return; }
  const c = A.clean(S.hist[code], (S.ind[code] || {}).gap), an = A.analyze(c), n = c.p.length;
  const q = S.quotes[code] || {};

  const tr = an.trend;
  const vc = an.verdict === "買進" ? "buy" : an.verdict === "賣出" ? "sell" : "hold";
  const rows = an.steps.map((s) => '<tr><td>' + s.tf + '</td><td class="l">' + esc(s.name) + '</td><td class="flat">×' + s.weight + '</td><td class="sc ' +
    (s.score > 0 ? "p" : s.score < 0 ? "n" : "") + '">' + (s.score > 0 ? "+" : "") + s.score + '</td><td class="l">' + esc(s.text) + '</td></tr>').join("");
  const risk = A.riskPct(c.p), ref = q.last > 0 ? q.last : c.p[n - 1];
  const plan = an.verdict === "買進" ?
    '<div class="sub">若要進場：參考價 ' + n2(ref) + '，停損 ' + n2(ref * (1 - risk)) + '（-' + (risk * 100).toFixed(1) + '%），目標 ' + n2(ref * (1 + 2 * risk)) + '（+' + (risk * 200).toFixed(1) + '%）。</div>' :
    an.verdict === "賣出" ? '<div class="sub">若已持有：可考慮減碼，或在反彈至 ' + (an.levels.resistances[0] ? n2(an.levels.resistances[0].price) : n2(an.ma20[n - 1])) + ' 附近出場。</div>' :
    '<div class="sub">已持有者可續抱，並以 ' + (an.levels.supports[0] ? n2(an.levels.supports[0].price) : n2(an.ma60[n - 1])) + '（下方支撐）作為防守；空手者等訊號轉強再進。</div>';
  const sg = (v) => (v > 0 ? "+" : "") + v;

  /* The right panel keeps only the conclusion; the long table and notes go below the chart at full width. */
  $("detail").innerHTML = head +
    '<div class="head" style="margin-top:12px"><span class="verdict ' + vc + '">' + an.verdict + '</span>' +
      '<span>' + esc(an.why) + '</span></div>' + plan +
    '<div class="sub">訊號分數：週 ' + sg(an.wScore) + '、日 ' + sg(an.dScore) + '、合計 ' + sg(an.total) + '　<a href="#chartdock">↓ K 線圖與逐步訊號在下方</a></div></div>';
  const below = '<div class="pad" id="ta-below" style="padding-top:0"><div class="sub">逐步訊號（週線定方向，日線定時機）：週 ' + sg(an.wScore) + '、日 ' + sg(an.dScore) + '、合計 ' + sg(an.total) + '</div>' +
    '<div class="scroll"><table id="steptable"><thead><tr><th>週期</th><th class="l">項目</th><th>權重</th><th>分數</th><th class="l">說明</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
    '<details class="adv"><summary>評分標準與它的歷史表現</summary><div class="note" id="score-std">' +
    '<strong>權重：</strong>趨勢結構（週線位置、週均線排列、日均線排列、日趨勢線）各 ×2；日線位置、週 RSI、日 RSI 各 ×1；支撐壓力只在「離壓力太近」時扣 1 分（貼近支撐不加分）；' +
    '<strong>兩個 MACD 只顯示、不計分</strong>。' +
    '<br><strong>為什麼：</strong>以全市場約一年（至 2026-09）的收盤回放、看之後 20 個交易日報酬（約 5.6 萬筆、分前後半段）：趨勢結構的項目在前後半段方向一致；MACD 兩項在前後半段方向相反（不穩定）；貼近支撐並沒有比較好。' +
    '調整後「買進」組平均約 +2.2%（前後半段都是），全體平均 +1.6%；<strong>「賣出」組沒有下跌</strong>（約 +1.4%），因為這段期間大盤上漲、弱勢股常反彈——所以「賣出」指趨勢向下，不是預測會跌。' +
    '<br><strong>能信多少：</strong>只有一年、多頭行情，同一天的股票彼此高度相關，有效樣本遠少於 5.6 萬；權重是用同一段資料挑的，這是在樣本內的結果。分數衡量的是趨勢強弱，不是報酬預測。</div></details>' +
    (tr.supLine ? '<div class="note">上升趨勢線（連接最近兩個低點）目前約在 ' + n2(tr.supLine.now) + '，跌破視為趨勢轉弱。</div>' : "") +
    (tr.resLine ? '<div class="note">下降趨勢線（連接最近兩個高點）目前約在 ' + n2(tr.resLine.now) + '，突破視為轉強。</div>' : "") +
    '<div class="note">買進需合計 ≥ +' + A.VERDICT_AT + ' 且週線分數不為負；≤ -' + A.VERDICT_AT + ' 為賣出；其餘持有（滿分 +11、最低 -12）。本週若尚未收完，週線以最新收盤暫代。' +
    '支撐壓力為收盤價的轉折群聚，不含盤中高低點。</div>' + DISCLAIMER + '</div>';
  paintDock(an, below);
}

/* ---- 5. sectors and themes: how each group moved over 1 / 5 / 20 / 60 / 120 / 240 trading days.
 * Numbers come from Analysis.sectorStats (equal-weighted mean or median of the members). */
const SEC_PERIODS = [[1, "今日"], [5, "5日"], [20, "20日"], [60, "60日"], [120, "120日"], [240, "240日"]];
const SEC_MIN = 5;   // a group needs this many members with data to be ranked among the leaders / laggards
const SEC_SCALE = {1: 0.04, 5: 0.08, 20: 0.15, 60: 0.3, 120: 0.5, 240: 0.8};   // return that earns a full-strength tint
S.sec = {period: 5, stat: "mean", kind: "all", open: null, sort: 5, dir: -1, ready: false, err: null};

const spct = (v) => v == null ? "—" : (v > 0 ? "+" : "") + (v * 100).toFixed(2) + "%";
function heat(v, p){
  if(v == null) return "";
  const a = Math.min(0.42, Math.abs(v) / SEC_SCALE[p] * 0.42);
  return ' style="background:' + (v > 0 ? "rgba(214,69,58," : "rgba(18,145,95,") + a.toFixed(2) + ')"';
}

function secCompute(){
  const sec = S.sec, groups = A.sectorGroups(S.index, S.themes);
  const codes = [...new Set(groups.flatMap((g) => g.codes))];
  const rets = A.memberReturns(S.closes, S.quotes, S.info, codes);
  return {groups, rets, stats: A.sectorStats(groups, rets)};
}

function secValue(g, p){ const x = g.ret[p]; return x ? x[S.sec.stat] : null; }

function paintSector(){
  const sec = S.sec;
  if(!sec.ready){
    $("detail").innerHTML = '<div class="pad"><div class="head"><span class="sym">類股漲跌</span></div><div class="empty">' +
      (sec.err ? "載入失敗：" + esc(sec.err) : "載入全市場收盤價與類股清單…") + '</div></div>';
    if(!sec.err && !sec.loading){
      sec.loading = true;
      (async () => {
        try{
          try{ S.themes = await getJSON("themes.json", false); }catch(e){ S.themes = {themes: []}; }
          await loadCloses(); sec.ready = true;
        }catch(e){ sec.err = String(e && e.message || e); }
        sec.loading = false;
        if(S.view === "sector") paintSector();
      })();
    }
    return;
  }
  const {rets, stats} = secCompute(), p = sec.period;
  const hasIndustry = S.index.some((i) => i.s);
  const rows = stats.filter((g) => sec.kind === "all" || g.kind === sec.kind);
  const val = (g) => sec.sort === "name" ? g.name : sec.sort === "n" ? g.codes.length : secValue(g, sec.sort);
  rows.sort((a, b) => {
    const x = val(a), y = val(b);
    if(x == null && y == null) return 0; if(x == null) return 1; if(y == null) return -1;
    return (x < y ? -1 : x > y ? 1 : 0) * sec.dir;
  });
  const ranked = rows.filter((g) => secValue(g, p) != null && g.ret[p].n >= SEC_MIN).sort((a, b) => secValue(b, p) - secValue(a, p));
  const card = (title, list) => '<div class="seccard"><div class="sub" style="margin:0 0 6px">' + title + '</div>' + (list.length ? list.map((g) =>
    '<div class="secline"><span>' + esc(g.name) + '</span><b class="' + cls(secValue(g, p)) + '">' + spct(secValue(g, p)) + '</b></div>').join("") : '<div class="flat">—</div>') + '</div>';
  const lab = SEC_PERIODS.find((x) => x[0] === p)[1];
  const chip = (attr, val, label, on) => '<button class="chip" ' + attr + '="' + val + '" aria-pressed="' + on + '">' + label + '</button>';
  const arrow = (k) => sec.sort === k ? (sec.dir > 0 ? " ▲" : " ▼") : "";
  const th = (k, label, extra) => '<th data-sec-sort="' + k + '" style="cursor:pointer"' + (extra || "") + '>' + label + arrow(k) + '</th>';
  const body = rows.map((g) => {
    const open = sec.open === g.key;
    let h = '<tr class="secrow" data-sec-open="' + esc(g.key) + '" style="cursor:pointer"><td class="l"><strong>' + (open ? "▾ " : "▸ ") + esc(g.name) + '</strong> <span class="tag">' +
      (g.kind === "industry" ? "產業" : "題材") + '</span>' + ((g.ret[p] ? g.ret[p].n : 0) < SEC_MIN ? ' <span class="flat" style="font-size:11.5px" title="有資料的成分股少於 ' + SEC_MIN + ' 檔，一檔的大波動就會拉動平均，不列入領漲／領跌">樣本少</span>' : "") + '</td><td>' + g.codes.length + '</td>' +
      SEC_PERIODS.map(([n]) => '<td' + heat(secValue(g, n), n) + (n === p ? ' class="selcol"' : "") + '>' + spct(secValue(g, n)) + '</td>').join("") +
      '<td>' + (g.ret[p] ? Math.round(g.ret[p].up * 100) + "%" : "—") + '</td></tr>';
    if(open){
      const ms = g.codes.filter((c) => rets[c]).map((c) => ({c, r: rets[c]})).sort((a, b) => (b.r[p] == null ? -9 : b.r[p]) - (a.r[p] == null ? -9 : a.r[p]));
      h += '<tr class="secmem"><td colspan="9"><div class="scroll" style="margin-top:0"><table><thead><tr><th class="l">代號 名稱</th><th>現價</th>' +
        SEC_PERIODS.map(([, l]) => '<th>' + l + '</th>').join("") + '<th></th></tr></thead><tbody>' +
        ms.map((m) => { const it = S.byCode[m.c] || {}, q = S.quotes[m.c] || {};
          return '<tr><td class="l"><strong>' + esc(m.c) + '</strong> ' + esc(it.n || "") + '</td><td>' + n2(q.last > 0 ? q.last : null) + '</td>' +
            SEC_PERIODS.map(([n]) => '<td' + heat(m.r[n], n) + '>' + spct(m.r[n]) + '</td>').join("") +
            '<td><button class="act" data-go="ta" data-code="' + esc(m.c) + '">分析</button></td></tr>'; }).join("") +
        '</tbody></table></div></td></tr>';
    }
    return h;
  }).join("");
  const last = S.closes.d[S.closes.d.length - 1];
  $("detail").innerHTML = '<div class="pad"><div class="head"><span class="sym">類股漲跌</span><span class="tag">' + rows.length + ' 個類股／題材</span></div>' +
    '<div class="chbar">' + SEC_PERIODS.map(([n, l]) => chip("data-sec-period", n, l, p === n)).join("") + '<span class="sep"></span>' +
    chip("data-sec-kind", "all", "全部", sec.kind === "all") + chip("data-sec-kind", "industry", "產業別", sec.kind === "industry") + chip("data-sec-kind", "theme", "題材", sec.kind === "theme") +
    '<span class="sep"></span>' + chip("data-sec-stat", "mean", "平均", sec.stat === "mean") + chip("data-sec-stat", "median", "中位數", sec.stat === "median") + '</div>' +
    (hasIndustry ? "" : '<div class="alert">官方產業別要等下一次完整建置才有，目前只有題材。</div>') +
    '<div class="seccards">' + card(lab + " 領漲", ranked.slice(0, 5)) + card(lab + " 領跌", ranked.slice(-5).reverse()) + '</div>' +
    '<div class="scroll"><table id="sectable"><thead><tr>' + th("name", "類股／題材", ' class="l"') + th("n", "家數") +
    SEC_PERIODS.map(([n, l]) => th(n, l)).join("") + '<th>' + lab + ' 上漲比</th></tr></thead><tbody>' + (body || '<tr><td colspan="9"><div class="empty">沒有資料。</div></td></tr>') + '</tbody></table></div>' +
    '<div class="note">每格是該類股成分股報酬的' + (sec.stat === "mean" ? "<strong>等權平均</strong>" : "<strong>中位數</strong>") + '（沒有市值資料，無法市值加權；小型股的大波動會拉動平均，可切到中位數對照）。' +
    '「今日」用最新報價的漲跌，其餘以收盤計算至 ' + esc(last) + '；價格有異常跳空的個股，跨過跳空的期間不計入。領漲／領跌只列有資料的成分股至少 5 檔的類股（不足的在表中標「樣本少」）。' +
    '「產業別」是證交所／櫃買中心的分類，「題材」是自訂清單（themes.json，草稿，可自行增修）；同一檔可同時屬於產業與多個題材。點一列展開成分股。</div>' + DISCLAIMER + '</div>';
}

/* ---- 0. home */
const HOME_BUCKETS = [
  ["漲停", (p) => p >= 9.5, "up", 1], [">5%", (p) => p >= 5 && p < 9.5, "up", .8], ["2~5%", (p) => p >= 2 && p < 5, "up", .6],
  ["0~2%", (p) => p > 0 && p < 2, "up", .4], ["平盤", (p) => p === 0, "flat", .5], ["0~2%", (p) => p < 0 && p > -2, "down", .4],
  ["2~5%", (p) => p <= -2 && p > -5, "down", .6], ["<-5%", (p) => p <= -5 && p > -9.5, "down", .8], ["跌停", (p) => p <= -9.5, "down", 1]];

function homeStocks(board){
  const out = [];
  for(const it of S.index){
    if(it.k === "ETF" || it.b !== board) continue;
    const q = S.quotes[it.c];
    if(q && q.pct != null && q.last > 0) out.push({it, q});
  }
  return out;
}

function paintHome(){
  const h = S.home, rows = homeStocks(h.board), mk = S.market;
  const chip = (attr, val, label, on) => '<button class="chip" ' + attr + '="' + val + '" aria-pressed="' + on + '">' + label + '</button>';
  const boardChips = '<span>' + chip("data-home-board", "TWSE", "上市", h.board === "TWSE") + chip("data-home-board", "TPEX", "上櫃", h.board === "TPEX") + '</span>';

  /* a tiny line of the session's 5-minute closes; only the US indices have one (the futures feed is a quote, not a series) */
  const spark = (arr, up) => {
    if(!arr || arr.length < 2) return "";
    const lo = Math.min(...arr), hi = Math.max(...arr), W = 110, H = 26, sp = (hi - lo) || 1;
    const pts = arr.map((v, i) => (i * W / (arr.length - 1)).toFixed(1) + "," + (H - 2 - (v - lo) * (H - 4) / sp).toFixed(1)).join(" ");
    return '<svg class="spark" viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '" aria-hidden="true"><polyline points="' + pts + '" fill="none" stroke="' + (up ? "var(--up)" : "var(--down)") + '" stroke-width="1.5"/></svg>';
  };
  const idxCard = (name, x, note, sp) => '<div class="idxcard" data-idx="' + esc(name) + '"><span class="flat" style="font-size:13px">' + name + '</span><span class="v ' + cls(x.chg) + '">' + n2(x.close != null ? x.close : x.price) + '</span><span class="' + cls(x.chg) + '">' +
    sign(x.chg) + ' (' + sign(x.pct) + '%)</span>' + (sp || "") + (note ? '<span class="flat" style="font-size:11.5px;display:block">' + note + '</span>' : "") + '</div>';
  const glob = ((S.globals && S.globals.items) || []).map((g) => idxCard(esc(g.name), g, g.time ? esc(g.time.slice(5)) + "（台北時間）" : "", spark(g.spark, g.chg >= 0))).join("");
  const idx = mk && mk.close != null
    ? idxCard("加權指數", mk) + (mk.otc ? idxCard("櫃買指數", mk.otc, esc(mk.otc.date) + " 盤後") : "") + glob
    : '<div class="empty">指數資料尚未載入。</div>';

  const by = {};
  for(const {it, q} of rows) if(it.s) (by[it.s] = by[it.s] || []).push(q.pct);
  const secs = Object.entries(by).filter(([, a]) => a.length >= SEC_MIN).map(([name, a]) => ({name, v: a.reduce((x, y) => x + y, 0) / a.length}));
  secs.sort((a, b) => h.lead === "up" ? b.v - a.v : a.v - b.v);
  const top = secs.slice(0, 5), mx = Math.max(0.01, ...top.map((x) => Math.abs(x.v)));
  /* 相對強弱 = the sector's change minus its board's index change (加權 for 上市, 櫃買 for 上櫃) */
  const boardPct = h.board === "TWSE" ? (mk && mk.pct) : (mk && mk.otc && mk.otc.pct);

    top.map((x) => '<div class="hbar"><span>' + esc(x.name) + '</span><span><i class="' + cls(x.v) + '" style="width:' +
    Math.max(2, Math.abs(x.v) / mx * 100).toFixed(0) + '%"></i></span><b class="' + cls(x.v) + '">' + sign(x.v) + '%</b>' +
    '<span class="rs ' + (boardPct == null ? "flat" : cls(x.v - boardPct)) + '">' + rs(x.v) + '</span></div>').join("") +
    '<div class="note" style="margin-top:6px">相對強弱 ＝ 類股漲跌 − ' + (h.board === "TWSE" ? "加權" : "櫃買") + '指數漲跌（百分點）' + (boardPct == null ? "；指數資料尚未載入" : "") + '。</div>' 
    : '<div class="empty">產業別要等下一次完整建置才有。</div>';

  const counts = HOME_BUCKETS.map(([, f]) => rows.filter(({q}) => f(q.pct)).length), cmax = Math.max(1, ...counts);
  const nUp = rows.filter(({q}) => q.pct > 0).length, nDn = rows.filter(({q}) => q.pct < 0).length, nFl = rows.length - nUp - nDn;
  const tot = Math.max(1, rows.length), pc = (n) => (n / tot * 100).toFixed(1);
  const dist = '<div class="dist">' + HOME_BUCKETS.map(([label, , c, a], i) => '<div><b>' + counts[i] + '</b><span class="b" style="height:' +

  const hot = rows.filter(({q}) => h.hot === "pct" ? true : q.vol > 0).slice().sort((a, b) => h.hot === "pct" ? b.q.pct - a.q.pct : (b.q.vol || 0) - (a.q.vol || 0)).slice(0, 10);

      return '<li>' + (u ? '<a href="' + esc(u) + '" target="_blank" rel="noopener noreferrer">' + esc(n.t) + '</a>' : esc(n.t)) +
        ' <span class="flat">' + esc(n.p || "") + (n.at ? " · " + ago(n.at) : "") + '</span></li>'; }).join("") + '</ul>' +
      '<div class="note">標題來自 Google 新聞搜尋（關鍵字「' + (h.news === "tw" ? "台股" : "美股") + '」，最近一天），點標題開啟原始報導；本站不轉載內文，也不代表新聞觀點。</div>'
      : '<div class="empty" style="padding:18px">' + (S.news ? "目前沒有抓到新聞。" : "新聞資料還沒載入（要等網站下一次更新）。") + '</div>') + '</div>';

    : '<div class="empty" style="padding:18px">' + (h.mine === "watch" ? "還沒有自選股，在「看板」清單點 ☆ 加入。" : "還沒有持倉，到「持倉」分頁新增。") + '</div>';

/* ---- 4. backtest */
function readBT(){
  const b = S.bt;
  if(!$("bt-kind")) return;
  b.kind = $("bt-kind").value;
  b.a = $("bt-a") ? Number($("bt-a").value) : 0; b.b = $("bt-b") ? Number($("bt-b").value) : 0;
  b.bars = Number($("bt-bars").value); b.stop = Number($("bt-stop").value) || 0; b.cost = $("bt-cost").checked;
}
function runBT(){
  readBT();
  if(needHist()) return;
  const b = S.bt, it = S.byCode[S.sel], c = A.clean(S.hist[S.sel], (S.ind[S.sel] || {}).gap);
  if(b.kind === "ma_cross" && !(b.a > 0 && b.b > b.a)){ b.out = {err: "慢線必須大於快線。"}; return paintBT(); }
  if(b.kind === "rsi_rev" && !(b.a > 0 && b.b > b.a && b.b <= 100)){ b.out = {err: "賣出 RSI 必須大於買進 RSI（且 ≤ 100）。"}; return paintBT(); }
  if(b.kind === "breakout" && !(b.a >= 2 && b.b >= 2)){ b.out = {err: "N 與 M 至少為 2。"}; return paintBT(); }
  b.out = {rep: A.backtestReport(c, {kind: b.kind, a: b.a, b: b.b, bars: b.bars, stopPct: b.stop, cost: b.cost, etf: !!it && it.k === "ETF"}), code: S.sel};
  paintBT();
}
function paintBT(){
  const code = S.sel, it = S.byCode[code], b = S.bt, st = A.STRATS[b.kind];
  const head = '<div class="pad"><div class="head"><span class="sym">策略回測</span>' +
    (it ? '<span class="tag">' + esc(it.c) + ' ' + esc(it.n || "") + '</span>' : "") + '</div>' + codeBar() + '<div class="msg err" id="v-msg"></div>';
  const form = '<div class="bar"><div><label for="bt-kind">策略</label><select id="bt-kind">' +
    Object.entries(A.STRATS).map(([k, s]) => '<option value="' + k + '"' + (b.kind === k ? " selected" : "") + '>' + s.label + '</option>').join("") + '</select></div>' +
    (st.a ? '<div><label for="bt-a">' + st.a.k + '</label><input id="bt-a" type="number" min="1" value="' + b.a + '"></div>' +
            '<div><label for="bt-b">' + st.b.k + '</label><input id="bt-b" type="number" min="1" value="' + b.b + '"></div>' : "") +
    '<div><label for="bt-bars">期間</label><select id="bt-bars">' +
      [[60,"近 3 個月"],[120,"近 6 個月"],[250,"近 1 年"],[0,"全部可用"]].map(([v, l]) => '<option value="' + v + '"' + (b.bars === v ? " selected" : "") + '>' + l + '</option>').join("") + '</select></div>' +
    '<div><label for="bt-stop">停損 %（0=不設）</label><input id="bt-stop" type="number" min="0" step="0.5" value="' + b.stop + '"></div>' +
    '<div><label><input id="bt-cost" type="checkbox"' + (b.cost ? " checked" : "") + ' style="width:auto"> 計入手續費與證交稅</label></div>' +
    '<button class="btn" id="bt-run">執行回測</button></div>';
  const bad = needHist();
  let out = "";
  if(bad) out = bad;
  else if(b.out && b.out.err) out = '<div class="alert">' + esc(b.out.err) + '</div>';
  else if(b.out && b.out.code === code && b.out.rep) out = btResult(b.out.rep);
  else out = '<div class="empty">設定參數後按「執行回測」。</div>';
  $("detail").innerHTML = head + form + out +
    '<div class="note">規則：只做多、單一部位、全倉進出；訊號出現在某日收盤，隔日收盤成交（避免偷看未來）。' +
    '歷史資料約 2 年且只有收盤價，交易次數常常不多，<strong>次數 &lt; 10 的結果請當作參考而非證據</strong>。' +
    '「RSI 底背離」＝價格創較低低點、RSI 低點卻墊高（兩個轉折各需前後 3 日確認）；出場為 RSI &gt; 60 或持有 30 日。</div>' + DISCLAIMER + '</div>';
}
function btResult(rep){
  const r = rep.base, cell = (k, v, c) => '<div class="cell"><div class="k">' + k + '</div><div class="v ' + (c || "") + '">' + v + '</div></div>';
  const trs = r.trades.slice(-15).reverse().map((t) => '<tr><td class="l">' + esc(t.d0) + '</td><td>' + esc(t.d1) + (t.open ? "（未平倉）" : "") + '</td><td>' + n2(t.in) + '</td><td>' + n2(t.out) +
    '</td><td>' + t.bars + '</td><td class="' + cls(t.ret) + '">' + pc(t.ret) + '</td></tr>').join("");
  const mrow = (label, x) => '<tr><td class="l">' + label + '</td><td>' + x.n + '</td><td>' + pc(x.winRate, 0) + '</td><td>' + pf(x.pf) + '</td><td>' + pc(x.mdd) + '</td><td class="' + cls(x.total) + '">' + pc(x.total) + '</td></tr>';
  const mhead = '<div class="scroll"><table><thead><tr><th class="l">版本</th><th>交易</th><th>勝率</th><th>獲利因子</th><th>最大回撤</th><th>報酬</th></tr></thead><tbody>';
  const sw = rep.sweep.length ? '<div class="sub">參數掃描（同一段資料內最佳的前 3 組，<strong>屬樣本內結果，有過度擬合風險</strong>）</div>' +
    mhead + rep.sweep.map((s) => mrow(s.a + ' / ' + s.b, s.r)).join("") + '</tbody></table></div>' : "";
  const vt = rep.variants.length ? '<div class="sub">實測：同一策略加上條件後的差異</div>' + mhead + mrow("原策略", r) +
    rep.variants.map((v) => mrow(esc(v.label), v.r)).join("") + '</tbody></table></div>' : "";
  return '<div class="sub">' + esc(r.from) + ' ~ ' + esc(r.to) + '（' + r.bars + ' 個交易日）</div><div class="grid">' +
    cell("交易次數", r.n) + cell("勝率", pc(r.winRate)) + cell("獲利因子", pf(r.pf)) + cell("最大回撤", pc(r.mdd), "down") +
    cell("策略報酬", pc(r.total), cls(r.total)) + cell("買進持有", pc(r.bh), cls(r.bh)) +
    cell("平均獲利", pc(r.avgWin), "up") + cell("平均虧損", pc(r.avgLoss), "down") + cell("持倉時間占比", pc(r.exposure, 0)) + '</div>' +
    (r.n < 10 ? '<div class="alert">交易只有 ' + r.n + ' 次，樣本偏少，勝率與獲利因子參考價值有限。</div>' : "") +
    '<div class="sub">改進方向</div>' + (rep.tips.length ? '<ul class="reasons">' + rep.tips.map((t) => '<li>' + esc(t) + '</li>').join("") + '</ul>' :
      '<div class="note" style="margin-top:4px">這組參數下沒有明顯需要修正的地方，實測的改進版本也沒有勝過它。</div>') +
    vt + sw +
    (trs ? '<div class="sub">最近 ' + Math.min(15, r.n) + ' 筆交易</div><div class="scroll"><table><thead><tr><th class="l">進場日</th><th>出場日</th><th>進場價</th><th>出場價</th><th>持有日</th><th>報酬</th></tr></thead><tbody>' + trs + '</tbody></table></div>' : "");
}
